<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Cricket Dashboard - Tournaments</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        h2 { color: #333; margin: 0; font-family: 'Oswald', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
        .box { background: #f9f9f9; padding: 18px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 10px; font-size: 14px; color: #444; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .btn:hover { background: #218838; }
        
        /* প্রোফাইল সেকশন স্টাইল */
        .profile-box { display: flex; align-items: center; gap: 15px; background: #e8f4fd; border: 1px solid #b8daff; padding: 15px; border-radius: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .profile-avatar { width: 65px; height: 65px; border-radius: 50%; background: #ccc; object-fit: cover; border: 2px solid #0056b3; }
        .profile-info { flex: 1; }
        .profile-info h3 { margin: 0 0 3px 0; color: #0056b3; font-size: 18px; }
        .profile-info p { margin: 0; font-size: 13px; color: #555; }
        .profile-btn-group { display: flex; gap: 8px; }
        
        .btn-profile-link { background: #17a2b8; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
        .btn-profile-link:hover { background: #138496; }

        .tournament-list { list-style: none; padding: 0; margin-top: 10px; }
        .tournament-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tournament-item a { text-decoration: none; color: #0056b3; font-weight: bold; font-size: 16px; flex: 1; margin-right: 15px; word-break: break-word; display: flex; align-items: center; justify-content: space-between; }
        .tournament-item a:hover { text-decoration: underline; }
        .tour-arrow { font-size: 18px; color: #666; font-weight: bold; margin-left: 10px; }
        .tournament-actions { display: flex; align-items: center; gap: 10px; }
        .btn-delete-tour { background: rgba(220, 53, 69, 0.1); color: #dc3545; border: 1px solid rgba(220, 53, 69, 0.3); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 5px; flex-shrink: 0; transition: all 0.2s ease; }
        .btn-delete-tour:hover { background: #dc3545; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard-header">
        <h2>🏆 Pro Cricket Dashboard</h2>
        <a id="myProfileLink" href="profile.html" class="btn-profile-link">👤 My Profile & Stats</a>
    </div>

    <!-- ইউজার প্রোফাইল ও নাম-ছবি কার্ড -->
    <div class="profile-box" id="userProfileCard">
        <img id="displayAvatar" src="https://via.placeholder.com/65" alt="Avatar" class="profile-avatar">
        <div class="profile-info">
            <h3 id="displayName">Loading User...</h3>
            <p>Click Edit to change your name or photo</p>
        </div>
        <div class="profile-btn-group">
            <button class="btn" style="width: auto; padding: 8px 14px; margin: 0; background: #0056b3; font-size: 13px;" onclick="window.openProfileModal()">Edit Profile</button>
        </div>
    </div>

    <!-- প্রোফাইল এডিট ফর্ম (লুকানো থাকবে) -->
    <div class="box" id="profileEditBox" style="display: none;">
        <h3>✏️ Update Profile Details</h3>
        <label>Your Name</label>
        <input type="text" id="inputProfileName" placeholder="Enter your name">
        <label>Profile Photo URL</label>
        <input type="text" id="inputProfilePhoto" placeholder="Paste direct image link">
        <div style="display: flex; gap: 10px;">
            <button class="btn" style="background: #0056b3;" onclick="window.saveUserProfile()">Save Profile</button>
            <button class="btn" style="background: #6c757d;" onclick="window.closeProfileModal()">Cancel</button>
        </div>
    </div>

    <div class="box">
        <h3>Create New Tournament</h3>
        <label>Tournament Name</label>
        <input type="text" id="tourNameInput" placeholder="e.g. Summer Premier League 2026">
        <button class="btn" onclick="window.createTournament()">Create Tournament</button>
    </div>

    <div class="box">
        <h3>Your Tournaments</h3>
        <ul id="tournamentsListContainer" class="tournament-list">
            <li style="text-align:center; color:#888;">Loading tournaments...</li>
        </ul>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, remove, update } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4yHWFEhUPjff5zS71DUNFK21vtqapKSU",
        authDomain: "cricket-score-d187a.firebaseapp.com",
        databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
        projectId: "cricket-score-d187a",
        storageBucket: "cricket-score-d187a.firebasestorage.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    let currentUsername = urlParams.get('u') || localStorage.getItem('proCricketUsername');

    if (!currentUsername) {
        currentUsername = prompt("Enter your username/channel name to continue:") || "admin_user";
        localStorage.setItem('proCricketUsername', currentUsername);
    }

    // প্রোফাইল পেজে ইউজারনেমসহ লিংক সেট করা
    document.getElementById('myProfileLink').href = `profile.html?u=${currentUsername}`;

    let currentUserId = "";

    async function verifyAndRegisterUser() {
        const userRef = ref(db, 'usernames/' + currentUsername);
        const snap = await get(userRef);
        if (!snap.exists()) {
            currentUserId = 'user_' + Date.now();
            await set(userRef, currentUserId);
            await set(ref(db, `users/${currentUserId}/profile`), {
                name: currentUsername,
                photo: "https://via.placeholder.com/65"
            });
        } else {
            currentUserId = snap.val();
        }
        loadUserProfile();
        loadTournaments();
    }

    async function loadUserProfile() {
        try {
            const profileSnap = await get(ref(db, `users/${currentUserId}/profile`));
            if (profileSnap.exists()) {
                const pData = profileSnap.val();
                document.getElementById('displayName').innerText = pData.name || currentUsername;
                if (pData.photo) {
                    document.getElementById('displayAvatar').src = pData.photo;
                }
            } else {
                document.getElementById('displayName').innerText = currentUsername;
            }
        } catch (err) {
            console.error("Error loading profile:", err);
        }
    }

    window.openProfileModal = function() {
        document.getElementById('profileEditBox').style.display = 'block';
        document.getElementById('inputProfileName').value = document.getElementById('displayName').innerText;
        document.getElementById('inputProfilePhoto').value = document.getElementById('displayAvatar').src;
    };

    window.closeProfileModal = function() {
        document.getElementById('profileEditBox').style.display = 'none';
    };

    window.saveUserProfile = async function() {
        const newName = document.getElementById('inputProfileName').value.trim();
        const newPhoto = document.getElementById('inputProfilePhoto').value.trim();

        if (!newName) {
            alert("⚠️ Name cannot be empty!");
            return;
        }

        try {
            await update(ref(db, `users/${currentUserId}/profile`), {
                name: newName,
                photo: newPhoto || "https://via.placeholder.com/65"
            });
            alert("✅ Profile updated successfully!");
            window.closeProfileModal();
            loadUserProfile();
        } catch (err) {
            console.error("Error saving profile:", err);
            alert("❌ Failed to update profile.");
        }
    };

    window.createTournament = async function() {
        const tName = document.getElementById('tourNameInput').value.trim();
        if (!tName) {
            alert("⚠️ Please enter a tournament name!");
            return;
        }

        try {
            const newTourRef = push(ref(db, `users/${currentUserId}/tournaments`));
            await set(newTourRef, {
                name: tName,
                createdAt: Date.now()
            });
            document.getElementById('tourNameInput').value = "";
            loadTournaments();
        } catch (err) {
            console.error("Error creating tournament:", err);
            alert("❌ Failed to create tournament.");
        }
    };

    async function loadTournaments() {
        const container = document.getElementById('tournamentsListContainer');
        container.innerHTML = "<li style='text-align:center; color:#888;'>Loading...</li>";

        try {
            const tourSnap = await get(ref(db, `users/${currentUserId}/tournaments`));
            
            if (tourSnap.exists()) {
                const tours = tourSnap.val();
                container.innerHTML = "";
                
                Object.keys(tours).forEach(tourId => {
                    const tour = tours[tourId];
                    let li = document.createElement('li');
                    li.className = "tournament-item";
                    li.innerHTML = `
                        <a href="tournament.html?t=${tourId}&u=${currentUsername}">
                            <span>${tour.name || 'Unnamed Tournament'}</span>
                            <span class="tour-arrow">➔</span>
                        </a>
                        <div class="tournament-actions">
                            <button class="btn-delete-tour" onclick="window.deleteTournament('${tourId}')" title="Delete Tournament">🗑️ Delete</button>
                        </div>
                    `;
                    container.appendChild(li);
                });
            } else {
                container.innerHTML = "<li style='text-align:center; color:#888;'>No tournaments found. Create one above!</li>";
            }
        } catch (e) {
            container.innerHTML = "<li style='text-align:center; color:red;'>Error loading tournaments.</li>";
        }
    }

    window.deleteTournament = async function(tourId) {
        if (!confirm("⚠️ Are you sure you want to delete this tournament? All associated data and matches will be removed.")) {
            return;
        }

        try {
            await remove(ref(db, `users/${currentUserId}/tournaments/${tourId}`));
            alert("🗑️ Tournament deleted successfully!");
            loadTournaments();
        } catch (err) {
            console.error("Error deleting tournament:", err);
            alert("❌ Failed to delete tournament.");
        }
    };

    verifyAndRegisterUser();
</script>

</body>
</html>

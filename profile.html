<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 750px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header-nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        
        /* ড্যাশবোর্ডে যাওয়ার বাটন স্টাইল */
        .btn-dash-link { background: #0056b3; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; }
        .btn-dash-link:hover { background: #004085; }

        h2 { color: #333; margin: 0; font-family: 'Oswald', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
        
        .profile-card { display: flex; align-items: center; gap: 20px; background: #e8f4fd; border: 1px solid #b8daff; padding: 20px; border-radius: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; background: #ccc; object-fit: cover; border: 3px solid #0056b3; }
        .profile-details { flex: 1; }
        .profile-details h3 { margin: 0 0 5px 0; color: #0056b3; font-size: 22px; }
        .profile-details p { margin: 0; color: #555; font-size: 14px; }
        
        .box { background: #f9f9f9; padding: 18px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 10px; font-size: 14px; color: #444; }
        input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .btn:hover { background: #218838; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
        @media(max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        .stat-card { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .stat-card span { font-size: 13px; color: #666; display: block; margin-bottom: 5px; }
        .stat-card strong { font-size: 20px; color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <h2>👤 Player Profile</h2>
        <!-- ড্যাশবোর্ডে যাওয়ার জন্য নতুন বাটন -->
        <a id="dashboardLinkBtn" href="index.html" class="btn-dash-link">🏠 Go to Dashboard</a>
    </div>

    <div class="profile-card">
        <img id="displayAvatar" src="https://via.placeholder.com/90" alt="Avatar" class="profile-avatar">
        <div class="profile-details">
            <h3 id="displayName">Loading User...</h3>
            <p>Pro Cricket Career Dashboard</p>
        </div>
        <button class="btn" style="width: auto; padding: 10px 18px; margin: 0;" onclick="window.toggleEditMode()">Edit Profile</button>
    </div>

    <div class="box" id="profileEditBox" style="display: none;">
        <h3>✏️ Edit Profile Details</h3>
        <label>Your Name</label>
        <input type="text" id="inputProfileName" placeholder="Enter your full name">
        <label>Profile Photo URL</label>
        <input type="text" id="inputProfilePhoto" placeholder="Paste direct image link">
        <div style="display: flex; gap: 10px;">
            <button class="btn" style="background: #0056b3;" onclick="window.saveUserProfile()">Save Changes</button>
            <button class="btn" style="background: #6c757d;" onclick="window.toggleEditMode()">Cancel</button>
        </div>
    </div>

    <div class="box">
        <h3 style="color: #0056b3; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-top: 0;">🏏 Cricket Career Statistics</h3>
        <div class="stats-grid">
            <div class="stat-card">
                <span>Matches Played</span>
                <strong id="statMatches">0</strong>
            </div>
            <div class="stat-card">
                <span>Total Runs</span>
                <strong id="statRuns" style="color: #28a745;">0</strong>
            </div>
            <div class="stat-card">
                <span>Total Wickets</span>
                <strong id="statWickets" style="color: #dc3545;">0</strong>
            </div>
            <div class="stat-card">
                <span>Total Fours (4s)</span>
                <strong id="statFours">0</strong>
            </div>
            <div class="stat-card">
                <span>Total Sixes (6s)</span>
                <strong id="statSixes">0</strong>
            </div>
            <div class="stat-card">
                <span>Man of the Match</span>
                <strong id="statMOM" style="color: #f39c12;">0</strong>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4yHWFEhUPjff5zS71DUNFK21vtqapKSU",
        authDomain: "cricket-score-d187a.firebaseapp.com",
        databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
        projectId: "cricket-score-d187a",
        storageBucket: "cricket-score-d187a.firebasestorage.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    let currentUsername = urlParams.get('u') || localStorage.getItem('proCricketUsername');

    if (!currentUsername) {
        alert("⚠️ Unauthorized access! Please login from dashboard.");
        window.location.href = "index.html";
    }

    // ড্যাশবোর্ড লিংকের সাথে ইউজারনেম পাস করার ব্যবস্থা
    document.getElementById('dashboardLinkBtn').href = `index.html?u=${currentUsername}`;

    let currentUserId = "";

    async function initProfilePage() {
        try {
            const userRef = ref(db, 'usernames/' + currentUsername);
            const snap = await get(userRef);
            if (snap.exists()) {
                currentUserId = snap.val();
                loadProfileData();
                loadCareerStats();
            } else {
                alert("User profile not found!");
                window.location.href = "index.html";
            }
        } catch (err) {
            console.error("Error initializing profile:", err);
        }
    }

    async function loadProfileData() {
        try {
            const profileSnap = await get(ref(db, `users/${currentUserId}/profile`));
            if (profileSnap.exists()) {
                const data = profileSnap.val();
                document.getElementById('displayName').innerText = data.name || currentUsername;
                if (data.photo) {
                    document.getElementById('displayAvatar').src = data.photo;
                }
            } else {
                document.getElementById('displayName').innerText = currentUsername;
            }
        } catch (e) {
            console.error("Error loading profile details:", e);
        }
    }

    async function loadCareerStats() {
        try {
            const tournamentsSnap = await get(ref(db, `live_matches/${currentUsername}/tournaments_data/`));
            
            let tMatches = 0, tRuns = 0, tWickets = 0, tFours = 0, tSixes = 0;

            if (tournamentsSnap.exists()) {
                const tournaments = tournamentsSnap.val();
                Object.keys(tournaments).forEach(tourId => {
                    const tourData = tournaments[tourId];
                    if (tourData && tourData.players) {
                        const myStats = tourData.players[document.getElementById('displayName').innerText] || tourData.players[currentUsername];
                        if (myStats) {
                            tMatches += (myStats.matchesPlayed || 0);
                            tRuns += (myStats.runs || 0);
                            tWickets += (myStats.wickets || 0);
                            tFours += (myStats.fours || 0);
                            tSixes += (myStats.sixes || 0);
                        }
                    }
                });
            }

            document.getElementById('statMatches').innerText = tMatches;
            document.getElementById('statRuns').innerText = tRuns;
            document.getElementById('statWickets').innerText = tWickets;
            document.getElementById('statFours').innerText = tFours;
            document.getElementById('statSixes').innerText = tSixes;

        } catch (err) {
            console.error("Error loading career stats:", err);
        }
    }

    window.toggleEditMode = function() {
        const box = document.getElementById('profileEditBox');
        if (box.style.display === 'none') {
            box.style.display = 'block';
            document.getElementById('inputProfileName').value = document.getElementById('displayName').innerText;
            document.getElementById('inputProfilePhoto').value = document.getElementById('displayAvatar').src;
        } else {
            box.style.display = 'none';
        }
    };

    window.saveUserProfile = async function() {
        const newName = document.getElementById('inputProfileName').value.trim();
        const newPhoto = document.getElementById('inputProfilePhoto').value.trim();

        if (!newName) {
            alert("⚠️ Name cannot be empty!");
            return;
        }

        try {
            await update(ref(db, `users/${currentUserId}/profile`), {
                name: newName,
                photo: newPhoto || "https://via.placeholder.com/90"
            });
            alert("✅ Profile updated successfully!");
            window.toggleEditMode();
            loadProfileData();
        } catch (err) {
            console.error("Error updating profile:", err);
            alert("❌ Failed to update profile.");
        }
    };

    initProfilePage();
</script>

</body>
</html>

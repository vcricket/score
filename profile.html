<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Cricket - Profile & Tournaments Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 850px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header-nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        
        .btn-dash-link { background: #0056b3; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; }
        .btn-dash-link:hover { background: #004085; }

        h2 { color: #333; margin: 0; font-family: 'Oswald', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
        
        /* প্রোফাইল কার্ড স্টাইল */
        .profile-card { display: flex; align-items: center; gap: 20px; background: #e8f4fd; border: 1px solid #b8daff; padding: 20px; border-radius: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; background: #ccc; object-fit: cover; border: 3px solid #0056b3; flex-shrink: 0; }
        .profile-details { flex: 1; }
        .profile-details h3 { margin: 0 0 5px 0; color: #0056b3; font-size: 22px; word-break: break-word; }
        .profile-details p { margin: 0; color: #555; font-size: 14px; }
        
        /* নেভিগেশন বাটন (অন্য পেজে রিডাইরেক্ট করার জন্য) */
        .nav-menu { display: flex; gap: 12px; margin-bottom: 25px; }
        .nav-btn { flex: 1; background: #f1f5f9; color: #334155; border: 2px solid #cbd5e1; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; text-align: center; text-decoration: none; display: inline-block; }
        .nav-btn.active { background: #1e3c72; color: white; border-color: #1e3c72; box-shadow: 0 4px 10px rgba(30,60,114,0.2); }
        .nav-btn:hover { background: #e2e8f0; color: #1e3c72; }
        .nav-btn.active:hover { background: #162c54; color: white; }

        .box { background: #f9f9f9; padding: 18px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 10px; font-size: 14px; color: #444; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .btn:hover { background: #218838; }

        /* টুর্নামেন্ট লিস্ট ও শুধু ডাস্টবিন আইকন বাটন */
        .tournament-list { list-style: none; padding: 0; margin-top: 10px; }
        .tournament-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 18px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tournament-item a { text-decoration: none; color: #0056b3; font-weight: bold; font-size: 16px; flex: 1; margin-right: 15px; display: flex; align-items: center; justify-content: space-between; word-break: break-word; }
        .tournament-item a:hover { text-decoration: underline; }
        .tour-arrow { font-size: 18px; color: #666; font-weight: bold; margin-left: 10px; }
        
        .tournament-actions { display: flex; align-items: center; gap: 10px; }
        .btn-delete-icon { background: rgba(220, 53, 69, 0.1); color: #dc3545; border: 1px solid rgba(220, 53, 69, 0.3); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; flex-shrink: 0; }
        .btn-delete-icon:hover { background: #dc3545; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <h2>🏆 Profile</h2>
        <a id="dashboardLinkBtn" href="index.html" class="btn-dash-link">🏠 Back</a>
    </div>

    <!-- প্রোফাইল কার্ড -->
    <div class="profile-card">
        <img id="displayAvatar" src="https://via.placeholder.com/90" alt="Avatar" class="profile-avatar">
        <div class="profile-details">
            <h3 id="displayName">Loading User...</h3>
            <p>Pro Cricket Performance & Tournament Hub</p>
        </div>
        <button class="btn" style="width: auto; padding: 10px 18px; margin: 0;" onclick="window.toggleEditMode()">Edit Profile</button>
    </div>

    <!-- প্রোফাইল এডিট ফর্ম -->
    <div class="box" id="profileEditBox" style="display: none;">
        <h3>✏️ Edit Profile Details</h3>
        <label>Your Name</label>
        <input type="text" id="inputProfileName" placeholder="Enter your full name">
        
        <label>Profile Picture (Choose from Gallery)</label>
        <input type="file" id="inputProfileFile" accept="image/*" style="padding: 8px; background: #fff;">
        
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn" style="background: #0056b3; margin-top: 0;" onclick="window.saveUserProfile()">Save Changes</button>
            <button class="btn" style="background: #6c757d; margin-top: 0;" onclick="window.toggleEditMode()">Cancel</button>
        </div>
    </div>

    <!-- দুটি নেভিগেশন বাটন -->
    <div class="nav-menu">
        <a id="perfBtn" href="profile.html" class="nav-btn active">📊 My Performance</a>
        <a id="tourBtn" href="tournaments.html" class="nav-btn">🏆 Tournaments & Matches</a>
    </div>

    <!-- টুর্নামেন্ট ক্রিয়েট ও লিস্ট সেকশন -->
    <div class="box">
        <h3>➕ Create New Tournament</h3>
        <label>Tournament Name</label>
        <input type="text" id="tourNameInput" placeholder="e.g. Summer Premier League 2026">
        <button class="btn" onclick="window.createTournament()">Create Tournament</button>
    </div>

    <div class="box">
        <h3>📋 My Tournaments & Matches</h3>
        <ul id="tournamentsListContainer" class="tournament-list">
            <li style="text-align:center; color:#888;">Loading tournaments...</li>
        </ul>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getDatabase, ref, get, update, set, push, remove } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4yHWFEhUPjff5zS71DUNFK21vtqapKSU",
        authDomain: "cricket-score-d187a.firebaseapp.com",
        databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
        projectId: "cricket-score-d187a",
        storageBucket: "cricket-score-d187a.firebasestorage.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    let currentUsername = urlParams.get('u') || localStorage.getItem('proCricketUsername');

    if (!currentUsername) {
        alert("⚠️ Please login from dashboard first.");
        window.location.href = "index.html";
    }

    document.getElementById('dashboardLinkBtn').href = `index.html?u=${currentUsername}`;
    document.getElementById('perfBtn').href = `profile.html?u=${currentUsername}`;
    document.getElementById('tourBtn').href = `tournaments.html?u=${currentUsername}`;

    let currentUserId = "";
    let selectedImageBase64 = "";

    async function initProfileHub() {
        try {
            const userRef = ref(db, 'usernames/' + currentUsername);
            const snap = await get(userRef);
            
            if (snap.exists()) {
                currentUserId = snap.val();
            } else {
                currentUserId = currentUsername;
            }

            loadProfileData();
            loadTournaments();
        } catch (err) {
            console.error("Error initializing profile hub:", err);
            currentUserId = currentUsername;
            loadProfileData();
            loadTournaments();
        }
    }

    async function loadProfileData() {
        try {
            const profileRef = ref(db, `users/${currentUserId}/profile`);
            const profileSnap = await get(profileRef);
            
            if (profileSnap.exists()) {
                const data = profileSnap.val();
                document.getElementById('displayName').innerText = data.name || currentUsername;
                if (data.photo) {
                    document.getElementById('displayAvatar').src = data.photo;
                }
            } else {
                await set(profileRef, {
                    name: currentUsername,
                    photo: ""
                });
                document.getElementById('displayName').innerText = currentUsername;
            }
        } catch (e) {
            console.error("Error loading profile details:", e);
            document.getElementById('displayName').innerText = currentUsername;
        }
    }

    window.createTournament = async function() {
        const tName = document.getElementById('tourNameInput').value.trim();
        if (!tName) {
            alert("⚠️ Please enter a tournament name!");
            return;
        }

        try {
            const newTourRef = push(ref(db, `users/${currentUserId}/tournaments`));
            await set(newTourRef, {
                name: tName,
                createdAt: Date.now()
            });
            document.getElementById('tourNameInput').value = "";
            loadTournaments();
            alert("🏆 Tournament created successfully!");
        } catch (err) {
            console.error("Error creating tournament:", err);
            alert("❌ Failed to create tournament.");
        }
    };

    async function loadTournaments() {
        const container = document.getElementById('tournamentsListContainer');
        container.innerHTML = "<li style='text-align:center; color:#888;'>Loading tournaments...</li>";

        try {
            const tourSnap = await get(ref(db, `users/${currentUserId}/tournaments`));
            
            if (tourSnap.exists()) {
                const tours = tourSnap.val();
                container.innerHTML = "";
                
                Object.keys(tours).forEach(tourId => {
                    const tour = tours[tourId];
                    let li = document.createElement('li');
                    li.className = "tournament-item";
                    // টুর্নামেন্ট নামের পাশে শুধু ডাস্টবিন (🗑️) আইকন বাটন রাখা হয়েছে, কোনো "Delete" লেখা নেই
                    li.innerHTML = `
                        <a href="tournament.html?t=${tourId}&u=${currentUsername}">
                            <span>🏆 ${tour.name || 'Unnamed Tournament'}</span>
                            <span class="tour-arrow">➔</span>
                        </a>
                        <div class="tournament-actions">
                            <button class="btn-delete-icon" onclick="window.deleteTournament('${tourId}')" title="Delete Tournament">🗑️</button>
                        </div>
                    `;
                    container.appendChild(li);
                });
            } else {
                container.innerHTML = "<li style='text-align:center; color:#888;'>No tournaments found. Create one above!</li>";
            }
        } catch (e) {
            container.innerHTML = "<li style='text-align:center; color:red;'>Error loading tournaments.</li>";
        }
    }

    window.deleteTournament = async function(tourId) {
        if (!confirm("⚠️ Are you sure you want to delete this tournament? All associated data and matches will be removed.")) {
            return;
        }

        try {
            await remove(ref(db, `users/${currentUserId}/tournaments/${tourId}`));
            alert("🗑 Tournament deleted successfully!");
            loadTournaments();
        } catch (err) {
            console.error("Error deleting tournament:", err);
            alert("❌ Failed to delete tournament.");
        }
    };

    window.toggleEditMode = function() {
        const box = document.getElementById('profileEditBox');
        if (box.style.display === 'none') {
            box.style.display = 'block';
            document.getElementById('inputProfileName').value = document.getElementById('displayName').innerText;
            selectedImageBase64 = "";
        } else {
            box.style.display = 'none';
        }
    };

    document.getElementById('inputProfileFile').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedImageBase64 = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    window.saveUserProfile = async function() {
        const newName = document.getElementById('inputProfileName').value.trim();
        if (!newName) {
            alert("⚠️ Name cannot be empty!");
            return;
        }

        try {
            let updateData = { name: newName };
            if (selectedImageBase64) {
                updateData.photo = selectedImageBase64;
            }

            await update(ref(db, `users/${currentUserId}/profile`), updateData);
            alert("✅ Profile updated successfully!");
            window.toggleEditMode();
            loadProfileData();
        } catch (err) {
            console.error("Error updating profile:", err);
            alert("❌ Failed to update profile. Image might be too large.");
        }
    };

    initProfileHub();
</script>

</body>
</html>

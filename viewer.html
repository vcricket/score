<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Scoreboard & Public Viewer</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            color: #ffffff; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .scoreboard-container { 
            background: #1e293b; 
            border: 1px solid #334155;
            padding: 25px; 
            border-radius: 14px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
            width: 100%; 
            max-width: 650px; 
            text-align: center; 
            position: relative; 
        }
        h2 { color: #38bdf8; margin-top: 0; font-size: 24px; margin-bottom: 15px; }
        .score-box { 
            background: #0f172a; 
            padding: 20px; 
            border-radius: 10px; 
            border: 1px solid #475569; 
            margin: 15px 0; 
        }
        .team-names { font-size: 20px; font-weight: bold; color: #facc15; margin-bottom: 8px; }
        .main-score { font-size: 48px; font-weight: bold; color: #ffffff; margin: 5px 0; }
        .match-details { display: flex; justify-content: space-around; font-size: 15px; color: #cbd5e1; margin-top: 10px; }
        .target-text { color: #4ade80; font-size: 16px; font-weight: bold; margin-top: 10px; }

        /* ওভারলে পপআপ স্টাইল (পয়েন্ট টেবিল, স্কোয়াড বা সামারির জন্য) */
        .overlay-screen { 
            display: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(15, 23, 42, 0.96); 
            z-index: 100; 
            border-radius: 14px; 
            padding: 20px; 
            box-sizing: border-box; 
            overflow-y: auto; 
            text-align: left;
        }
        .close-overlay-btn { 
            background: #ef4444; 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            font-size: 13px; 
            font-weight: bold; 
            border-radius: 5px; 
            cursor: pointer; 
            float: right; 
            margin-bottom: 10px; 
        }
        
        /* টেবিল স্টাইল (পয়েন্ট টেবিলের জন্য) */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        th, td {
            padding: 9px 6px;
            border-bottom: 1px solid #334155;
            text-align: center;
        }
        th {
            background-color: #0f172a;
            color: #38bdf8;
            font-weight: bold;
        }
        td:first-child {
            text-align: left;
            font-weight: bold;
        }
        .status-msg { font-size: 16px; color: #94a3b8; margin-top: 20px; }
    </style>
</head>
<body>

<div class="scoreboard-container" id="mainViewerCard">
    <h2 id="viewerHeader">Live Cricket Scoreboard</h2>
    
    <div class="score-box" id="activeScoreBox">
        <div class="team-names" id="vTeamNames">Loading Teams...</div>
        <div class="main-score" id="vMainScore">0/0</div>
        <div class="match-details">
            <div>Overs: <span id="vOvers">0.0</span> / <span id="vTotalOvers">10</span></div>
            <div>Innings: <span id="vInnings">1st</span></div>
        </div>
        <div class="target-text" id="vTarget">Match not started yet</div>
    </div>

    <!-- ডায়নামিক ওভারলে স্ক্রিন (পয়েন্ট টেবিল, স্কোয়াড বা সামারি প্রদর্শনের জন্য) -->
    <div id="dynamicOverlay" class="overlay-screen">
        <button class="close-overlay-btn" onclick="closeViewerOverlay()">✖ Close</button>
        <div style="clear: both;"></div>
        <div id="overlayBodyContent">Loading data...</div>
    </div>

    <div class="status-msg" id="connectionStatus">Connecting to live match...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4yHWFEhUPjff5zS71DUNFK21vtqapKSU",
        authDomain: "cricket-score-d187a.firebaseapp.com",
        databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
        projectId: "cricket-score-d187a",
        storageBucket: "cricket-score-d187a.firebasestorage.app",
        messagingSenderId: "782741896785",
        appId: "1:782741896785:web:78ab5ffe8c6a43ba928270"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const viewerUsername = urlParams.get('u');

    if (!viewerUsername) {
        document.getElementById('mainViewerCard').innerHTML = "<h2 style='color: #ef4444;'>⚠️ Invalid Viewer Link! Username missing.</h2>";
    } else {
        const liveScoreRef = ref(db, `live_matches/${viewerUsername}/score`);

        onValue(liveScoreRef, async (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                document.getElementById('vTeamNames').innerText = `${data.batTeamName || 'Team 1'} vs ${data.bowlTeamName || 'Team 2'}`;
                document.getElementById('vMainScore').innerText = `${data.runs || 0}/${data.wickets || 0}`;
                document.getElementById('vOvers').innerText = data.overs || "0.0";
                document.getElementById('vTotalOvers').innerText = data.totalOvers || "10";
                document.getElementById('vInnings').innerText = data.innings === "2" ? "2nd Innings" : "1st Innings";
                document.getElementById('vTarget').innerText = data.target || "";
                document.getElementById('connectionStatus').innerText = "🟢 Live Match Connected";

                // ১. যদি কন্ট্রোলার থেকে '📊 Points' বাটন অন করা হয়
                if (data.showPointsTableOnScreen) {
                    await renderTournamentPointsTableOverlay(viewerUsername, data.tournamentId);
                } 
                // ২. যদি স্কোয়াড বাটন অন করা হয়
                else if (data.showSquadsOnScreen) {
                    renderSquadsOverlay(data.squad1Data, data.squad2Data, data.batTeamName, data.bowlTeamName);
                } 
                // ৩. যদি সামারি বাটন অন করা হয়
                else if (data.showSummaryOnScreen) {
                    renderSummaryOverlay(data);
                } 
                // ৪. অন্যথায় ওভারলে বন্ধ থাকবে
                else {
                    closeViewerOverlay();
                }

            } else {
                document.getElementById('connectionStatus').innerText = "⏳ Waiting for match to start...";
            }
        });
    }

    // নির্দিষ্ট টুর্নামেন্টের পয়েন্ট টেবিল রেন্ডার করার ফাংশন
    async function renderTournamentPointsTableOverlay(username, tournamentId) {
        if (!tournamentId) {
            document.getElementById('overlayBodyContent').innerHTML = "<p style='color: #f87171;'>Tournament ID not found!</p>";
            document.getElementById('dynamicOverlay').style.display = 'block';
            return;
        }

        const pointsRef = ref(db, `live_matches/${username}/tournaments_data/${tournamentId}/teams/`);
        const snapshot = await get(pointsRef);
        let teamsData = snapshot.val() || {};
        
        let teamsArray = Object.keys(teamsData).map(key => teamsData[key]);
        
        // পয়েন্ট ও নেট রানরেট অনুযায়ী সর্টিং
        teamsArray.sort((a, b) => {
            if ((b.points || 0) !== (a.points || 0)) {
                return (b.points || 0) - (a.points || 0);
            }
            return parseFloat(b.netRunRate || 0) - parseFloat(a.netRunRate || 0);
        });

        let html = `
            <h3 style="color: #38bdf8; margin-top: 5px; text-align: center;">🏆 Tournament Points Table</h3>
            <table>
                <thead>
                    <tr>
                        <th style="text-align: left;">Team</th>
                        <th>P</th>
                        <th>W</th>
                        <th>L</th>
                        <th>Pts</th>
                        <th>NRR</th>
                    </tr>
                </thead>
                <tbody>
        `;

        if (teamsArray.length === 0) {
            html += `<tr><td colspan="6" style="text-align: center; padding: 20px; color: #94a3b8;">No teams found in this tournament yet.</td></tr>`;
        } else {
            teamsArray.forEach((team, idx) => {
                html += `
                    <tr>
                        <td style="text-align: left; font-weight: bold;">${idx + 1}. ${team.name || 'Team'}</td>
                        <td>${team.matchesPlayed || 0}</td>
                        <td>${team.won || 0}</td>
                        <td>${team.lost || 0}</td>
                        <td style="font-weight: bold; color: #facc15;">${team.points || 0}</td>
                        <td style="color: ${parseFloat(team.netRunRate || 0) >= 0 ? '#4ade80' : '#f87171'};">${team.netRunRate || '+0.000'}</td>
                    </tr>
                `;
            });
        }

        html += `</tbody></table>`;
        
        document.getElementById('overlayBodyContent').innerHTML = html;
        document.getElementById('dynamicOverlay').style.display = 'block';
    }

    function renderSquadsOverlay(squad1, squad2, t1Name, t2Name) {
        let html = `
            <h3 style="color: #38bdf8; text-align: center;">👥 Team Squads</h3>
            <div style="display: flex; gap: 15px; margin-top: 10px;">
                <div style="flex: 1; background: #0f172a; padding: 10px; border-radius: 8px;">
                    <b style="color: #facc15;">${t1Name || 'Team 1'}</b>
                    <pre style="white-space: pre-wrap; font-family: inherit; font-size: 13px; color: #cbd5e1; text-align: left;">${squad1 || 'No squad data'}</pre>
                </div>
                <div style="flex: 1; background: #0f172a; padding: 10px; border-radius: 8px;">
                    <b style="color: #facc15;">${t2Name || 'Team 2'}</b>
                    <pre style="white-space: pre-wrap; font-family: inherit; font-size: 13px; color: #cbd5e1; text-align: left;">${squad2 || 'No squad data'}</pre>
                </div>
            </div>
        `;
        document.getElementById('overlayBodyContent').innerHTML = html;
        document.getElementById('dynamicOverlay').style.display = 'block';
    }

    function renderSummaryOverlay(data) {
        let html = `
            <h3 style="color: #38bdf8; text-align: center;">📋 Match Summary</h3>
            <div style="background: #0f172a; padding: 15px; border-radius: 8px; font-size: 14px; text-align: left; color: #cbd5e1;">
                <p><b>Batting Team:</b> ${data.batTeamName}</p>
                <p><b>Bowling Team:</b> ${data.bowlTeamName}</p>
                <p><b>Score:</b> ${data.runs}/${data.wickets} (${data.overs} Overs)</p>
                <p><b>Current Striker:</b> ${data.bat1Name || 'N/A'} (${data.bat1Runs || 0} Runs, ${data.bat1Balls || 0} Balls)</p>
                <p><b>Non-Striker:</b> ${data.bat2Name || 'N/A'} (${data.bat2Runs || 0} Runs, ${data.bat2Balls || 0} Balls)</p>
                <p><b>Bowler:</b> ${data.bowlerName || 'N/A'} (${data.bowlerFig || '0-0'})</p>
            </div>
        `;
        document.getElementById('overlayBodyContent').innerHTML = html;
        document.getElementById('dynamicOverlay').style.display = 'block';
    }

    window.closeViewerOverlay = function() {
        document.getElementById('dynamicOverlay').style.display = 'none';
    };
</script>

</body>
</html>

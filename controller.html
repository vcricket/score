<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Score Controller - Advanced Bowler Tracking</title>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4yHWFEhUPjff5zS71DUNFK21vtqapKSU",
            authDomain: "cricket-score-d187a.firebaseapp.com",
            databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
            projectId: "cricket-score-d187a",
            storageBucket: "cricket-score-d187a.firebasestorage.app",
            messagingSenderId: "782741896785",
            appId: "1:782741896785:web:78ab5ffe8c6a43ba928270",
            measurementId: "G-PHXZ72EC94"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const currentMatchUser = urlParams.get('u') || "default_user";
        let activeTournamentId = urlParams.get('t');
        const activeMatchId = urlParams.get('m');
        const urlTeam1 = urlParams.get('t1');
        const urlTeam2 = urlParams.get('t2');

        function cleanTeamName(name) {
            if (!name) return "";
            let decoded = decodeURIComponent(name).trim();
            let parts = decoded.split('\n');
            return parts[0].trim();
        }
        window.cleanTeamName = cleanTeamName;

        window.returnToTournamentImmediately = function() {
            if (activeTournamentId && activeTournamentId !== "null" && activeTournamentId !== "undefined") {
                window.location.href = `tournament.html?t=${activeTournamentId}&u=${currentMatchUser || ''}`;
            } else if (currentMatchUser) {
                window.location.href = `tournament.html?u=${currentMatchUser}`;
            } else {
                window.location.href = `tournament.html`;
            }
        };

        window.sendToFirebase = function(scoreData) {
            const btn = document.getElementById('updateBtn');
            if(btn) {
                btn.innerText = "⚡ Auto-Updating...";
                btn.style.background = "#17a2b8";
            }
            
            set(ref(db, 'matchScore/'), scoreData).then(() => {
                if(btn) {
                    btn.innerText = "🟢 Live Update Active (Auto)";
                    btn.style.background = "#28a745";
                }
            }).catch((error) => {
                console.error("Firebase Error: ", error);
                if(btn) {
                    btn.innerText = "❌ Update Failed!";
                    btn.style.background = "#dc3545";
                }
            });
        };

        async function markMatchCompletedInDatabase(winnerText, winnerTeamName) {
            try {
                if (activeTournamentId && activeMatchId && currentMatchUser) {
                    const snap = await get(ref(db, 'usernames/' + currentMatchUser));
                    let uid = snap.exists() ? snap.val() : currentMatchUser;
                    await update(ref(db, `users/${uid}/tournaments/${activeTournamentId}/matches/${activeMatchId}`), {
                        status: 'completed',
                        winner: winnerTeamName || "",
                        resultText: winnerText || "Match Ended"
                    });
                }
            } catch (err) {
                console.error("Error setting status completed:", err);
            }
        }

        window.updateTournamentStandings = async function(winnerTeam, loserTeam, matchRunsScored, matchOversBowled, matchRunsConceded, matchOversAgainst) {
            const pointsRef = ref(db, 'tournament/teams/');
            try {
                const snapshot = await get(pointsRef);
                let teamsData = snapshot.val() || {};

                let t1Key = "team1", t2Key = "team2";
                let defaultTeam1Name = cleanTeamName(document.getElementById('batTeamName').value) || "Team 1";
                let defaultTeam2Name = cleanTeamName(document.getElementById('bowlTeamName').value) || "Team 2";

                let t1Obj = teamsData[t1Key] || { name: defaultTeam1Name, matchesPlayed: 0, won: 0, lost: 0, points: 0, totalRunsScored: 0, totalOversFaced: 0, totalRunsConceded: 0, totalOversBowled: 0, netRunRate: "+0.000" };
                let t2Obj = teamsData[t2Key] || { name: defaultTeam2Name, matchesPlayed: 0, won: 0, lost: 0, points: 0, totalRunsScored: 0, totalOversFaced: 0, totalRunsConceded: 0, totalOversBowled: 0, netRunRate: "+0.000" };

                let winnerKey = cleanTeamName(t1Obj.name).toLowerCase().trim() === cleanTeamName(winnerTeam).toLowerCase().trim() ? t1Key : t2Key;
                let loserKey = winnerKey === t1Key ? t2Key : t1Key;

                let winObj = winnerKey === t1Key ? t1Obj : t2Obj;
                let loseObj = loserKey === t1Key ? t1Obj : t2Obj;

                winObj.name = cleanTeamName(winnerTeam);
                loseObj.name = cleanTeamName(loserTeam);

                winObj.matchesPlayed = (winObj.matchesPlayed || 0) + 1;
                
                if (winnerTeam === "Tied") {
                    winObj.points = (winObj.points || 0) + 1;
                    loseObj.points = (loseObj.points || 0) + 1;
                } else {
                    winObj.won = (winObj.won || 0) + 1;
                    winObj.points = (winObj.points || 0) + 2;
                    loseObj.lost = (loseObj.lost || 0) + 1;
                }

                loseObj.matchesPlayed = (loseObj.matchesPlayed || 0) + 1;

                winObj.totalRunsScored = (winObj.totalRunsScored || 0) + matchRunsScored;
                winObj.totalOversFaced = (winObj.totalOversFaced || 0) + matchOversBowled;
                winObj.totalRunsConceded = (winObj.totalRunsConceded || 0) + matchRunsConceded;
                winObj.totalOversBowled = (winObj.totalOversBowled || 0) + matchOversAgainst;

                loseObj.totalRunsScored = (loseObj.totalRunsScored || 0) + matchRunsConceded;
                loseObj.totalOversFaced = (loseObj.totalOversFaced || 0) + matchOversAgainst;
                loseObj.totalRunsConceded = (loseObj.totalRunsConceded || 0) + matchRunsScored;
                loseObj.totalOversBowled = (loseObj.totalOversBowled || 0) + matchOversBowled;

                let winRunRate = winObj.totalOversFaced > 0 ? (winObj.totalRunsScored / winObj.totalOversFaced) - (winObj.totalRunsConceded / winObj.totalOversBowled) : 0;
                let loseRunRate = loseObj.totalOversFaced > 0 ? (loseObj.totalRunsScored / loseObj.totalOversFaced) - (loseObj.totalRunsConceded / loseObj.totalOversBowled) : 0;

                winObj.netRunRate = (winRunRate >= 0 ? "+" : "") + winRunRate.toFixed(3);
                loseObj.netRunRate = (loseRunRate >= 0 ? "+" : "") + loseRunRate.toFixed(3);

                teamsData[winnerKey] = winObj;
                teamsData[loserKey] = loseObj;

                await set(pointsRef, teamsData);
            } catch (error) {
                console.error("Points Update Error: ", error);
            }
        };

        window.savePointsToFirebase = function(teamsDataObj) {
            set(ref(db, 'tournament/teams/'), teamsDataObj).then(() => {
                alert("✅ Points table updated successfully!");
            }).catch((error) => {
                console.error("Points Update Error: ", error);
                alert("❌ Points table update failed!");
            });
        };

        // সব গুরুত্বপূর্ণ ফাংশন গ্লোবালি উইন্ডো অবজেক্টে বাইন্ড করা যাতে বাটন ক্লিক করলে সরাসরি কাজ করে
        window.addBall = addBall;
        window.addExtra = addExtra;
        window.addLegBye = addLegBye;
        window.openWicketModal = openWicketModal;
        window.closeWicketModal = closeWicketModal;
        window.submitWicketDetails = submitWicketDetails;
        window.addLBW = addLBW;
        window.openRunOutModal = openRunOutModal;
        window.closeRunOutModal = closeRunOutModal;
        window.submitRunOutDetails = submitRunOutDetails;
        window.swapStrike = swapStrike;
        window.undoAction = undoAction;
        window.toggleSquadDisplay = toggleSquadDisplay;
        window.togglePointsTableDisplay = togglePointsTableDisplay;
        window.toggleSummaryDisplay = toggleSummaryDisplay;
        window.declareWinnerManually = declareWinnerManually;
        window.onBowlerNameChange = onBowlerNameChange;
        window.validatePlayers = validatePlayers;
        window.swapTeams = swapTeams;
        window.closeInningsPopup = closeInningsPopup;
        window.closeMatchResultAndReset = closeMatchResultAndReset;
        window.handleDismissalChange = handleDismissalChange;
    </script>

    <style>
        body { font-family: Arial, sans-serif; background: #eef2f3; padding: 15px; margin: 0; }
        .container { max-width: 750px; margin: auto; background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .header-box { text-align: center; margin-bottom: 10px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        h2 { color: #333; margin: 0; font-size: 22px; }
        
        .sub-header-bar { display: flex; align-items: center; justify-content: space-between; background: #f8f9fa; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; flex-wrap: wrap; gap: 8px; }
        .sub-header-item { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: bold; color: #444; }
        .sub-header-item select, .sub-header-item input[type="number"] { padding: 4px 6px; font-size: 13px; font-weight: bold; border: 1px solid #ccc; border-radius: 4px; width: 60px; background: #fff; }
        
        .btn-sub-action { padding: 5px 10px; font-size: 12px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-winner-sub { background: #f39c12; }
        .btn-tour-back { background: #6c757d; }

        .box { background: #f9f9f9; padding: 14px; border: 1px solid #ddd; border-radius: 8px; }
        h3 { margin-top: 0; margin-bottom: 8px; color: #0056b3; font-size: 16px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
        
        label { font-weight: bold; display: block; margin-top: 8px; font-size: 14px; color: #444; }
        input, select, textarea { width: 100%; padding: 8px 10px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; font-weight: bold;}
        textarea { font-weight: normal; font-size: 14px; }
        
        .player-toggle-box { background: #e8f4fd; border: 1px solid #b8daff; margin-bottom: 12px; transition: all 0.3s ease; }
        .player-toggle-box summary { color: #0056b3; font-size: 17px; font-weight: bold; cursor: pointer; outline: none; }

        .player-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
        .player-grid-3 .box { padding: 8px; }
        .player-grid-3 h3 { font-size: 13px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .player-grid-3 label { font-size: 11px; margin-top: 4px; }
        .player-grid-3 input { padding: 6px 4px; font-size: 12px; }
        .small-flex { display: flex; gap: 4px; align-items: center; }

        .action-panel { background: #e3f2fd; text-align: center; border: 1px solid #b8daff; padding: 12px; }
        .btn-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
        @media (max-width: 500px) { .btn-grid { grid-template-columns: repeat(4, 1fr); } }
        
        .btn-action { padding: 12px 0; font-size: 18px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; color: white; background: #6c757d; }
        .btn-action:active { transform: scale(0.95); }
        .btn-4 { background: #28a745; } .btn-6 { background: #007bff; } .btn-w { background: #dc3545; }
        .btn-lbw { background: #e84118; color: white; }
        .btn-wd, .btn-nb { background: #ffc107; color: black; } .btn-lb { background: #6f42c1; } .btn-ro { background: #85144b; }
        
        .flex-btns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 10px; }
        @media(max-width: 650px) { .flex-btns { grid-template-columns: repeat(3, 1fr); } }
        
        .btn-control-small { padding: 8px 4px; font-size: 11px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; color: white; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-swap-s { background: #17a2b8; }
        .btn-undo-s { background: #fd7e14; }
        .btn-squad-s { background: #6f42c1; }
        .btn-points-s { background: #27ae60; }
        .btn-summary-s { background: #27ae60; }

        .teams-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 6px; }
        .btn-middle-swap { background: #6c5ce7; color: white; border: none; width: 45px; height: 42px; border-radius: 6px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.15); transition: transform 0.1s; }
        .btn-middle-swap:active { transform: scale(0.92); }

        .btn-save-squad { background: #28a745; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 12px; font-size: 15px; }
        .btn-main { width: 100%; padding: 12px; background: #28a745; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: default; margin-top: 10px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9998; justify-content: center; align-items: center; }
        .modal-box { background: #fff; padding: 25px; border-radius: 12px; max-width: 650px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); animation: popUpAnim 0.3s ease-out; position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-close-x { position: absolute; top: 15px; right: 20px; font-size: 22px; font-weight: bold; color: #888; cursor: pointer; }
        .modal-close-x:hover { color: #000; }

        #inningsPopupModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; }
        .popup-content { background: #fff; padding: 25px 30px; border-radius: 12px; text-align: center; max-width: 450px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); animation: popUpAnim 0.4s ease-out; }
        @keyframes popUpAnim { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .popup-content h2 { color: #d9534f; margin-top: 0; font-size: 24px; }
        .popup-content p { font-size: 18px; font-weight: bold; color: #333; margin: 15px 0; }
        .popup-close-btn { background: #28a745; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<!-- Final Match Result Modal -->
<div id="matchResultModal" class="modal-overlay" style="z-index: 10000;">
    <div class="popup-content" style="max-width: 450px;">
        <h2 style="color: #f39c12; margin-bottom: 15px;">🏆 Final Match Result</h2>
        <div id="matchResultDetails" style="font-size: 18px; font-weight: bold; color: #333; margin-bottom: 20px; white-space: pre-wrap; line-height: 1.5;"></div>
        <button class="btn-main" style="background: #dc3545; font-size: 18px;" onclick="closeMatchResultAndReset()">🔄 Return to Tournament</button>
    </div>
</div>

<!-- Innings Popup Modal -->
<div id="inningsPopupModal">
    <div class="popup-content">
        <h2>🛑 1st Innings Ended!</h2>
        <p id="popupInningsDetails">Team Name: Runs / Wickets</p>
        <button class="popup-close-btn" onclick="closeInningsPopup()">Start 2nd Innings ➔</button>
    </div>
</div>

<!-- Wicket Popup Modal -->
<div id="wicketPopupModal" class="modal-overlay">
    <div class="popup-content" style="max-width: 400px;">
        <h2 style="color: #dc3545; margin-bottom: 15px;">🏏 Wicket Details</h2>
        <div style="text-align: left;">
            <label>How out?</label>
            <select id="dismissalType" style="margin-bottom: 10px; padding: 10px;" onchange="handleDismissalChange()">
                <option value="bowled">Bowled</option>
                <option value="caught">Caught</option>
                <option value="stumped">Stumped</option>
            </select>

            <div id="fielderSelectionBox" style="display: none; margin-bottom: 10px;">
                <label id="fielderLabel">Fielder Name</label>
                <select id="fielderName" style="padding: 10px;"></select>
            </div>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn-save-squad" style="background: #6c757d; flex: 1; margin: 0;" onclick="closeWicketModal()">Cancel</button>
            <button class="btn-save-squad" style="background: #dc3545; flex: 1; margin: 0;" onclick="submitWicketDetails()">Confirm Wicket</button>
        </div>
    </div>
</div>

<!-- Run Out Popup Modal -->
<div id="runOutPopupModal" class="modal-overlay">
    <div class="popup-content" style="max-width: 400px;">
        <h2 style="color: #85144b; margin-bottom: 15px;">🏃 Run Out Details</h2>
        <div style="text-align: left;">
            <label>Runs Completed</label>
            <select id="runOutRuns" style="margin-bottom: 10px; padding: 10px;">
                <option value="0">0 Runs</option>
                <option value="1">1 Run</option>
                <option value="2">2 Runs</option>
                <option value="3">3 Runs</option>
            </select>

            <label>Fielder Name</label>
            <select id="runOutFielder" style="margin-bottom: 10px; padding: 10px;"></select>

            <label>Who Got Out?</label>
            <select id="runOutBatsman" style="margin-bottom: 10px; padding: 10px;"></select>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn-save-squad" style="background: #6c757d; flex: 1; margin: 0;" onclick="closeRunOutModal()">Cancel</button>
            <button class="btn-save-squad" style="background: #85144b; flex: 1; margin: 0;" onclick="submitRunOutDetails()">Confirm Run Out</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="header-box">
        <h2>🏏 Pro Score Controller</h2>
    </div>

    <!-- Sub-header Bar -->
    <div class="sub-header-bar">
        <button class="btn-sub-action btn-tour-back" onclick="returnToTournamentImmediately()">⬅️ Tournament</button>

        <div class="sub-header-item">
            <span>Innings:</span>
            <select id="innings" onchange="updateTargetMessage()">
                <option value="1">1st</option>
                <option value="2">2nd</option>
            </select>
        </div>
        <div class="sub-header-item">
            <span>Overs:</span>
            <input type="number" id="totalOvers" value="10" onchange="updateTargetMessage()">
        </div>
        
        <button class="btn-sub-action btn-winner-sub" onclick="declareWinnerManually()">🏆 End Match</button>
    </div>

    <datalist id="bowlerSuggestions"></datalist>
    <datalist id="bat1Suggestions"></datalist>
    <datalist id="bat2Suggestions"></datalist>

    <!-- Main Score Box -->
    <div class="box" style="margin-bottom: 12px;">
        <h3>📊 Main Score</h3>
        <div class="teams-row">
            <div style="flex: 1;"><label>Batting Team</label><input type="text" id="batTeamName" value="Team 1" readonly style="background: #e9ecef;"></div>
            <button class="btn-middle-swap" onclick="swapTeams()" title="Swap Teams">🔄</button>
            <div style="flex: 1;"><label>Bowling Team</label><input type="text" id="bowlTeamName" value="Team 2" readonly style="background: #e9ecef;"></div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <div style="flex: 1;"><label>Runs</label> <input type="number" id="runs" value="0" onchange="processAndUpdate()"></div>
            <div style="flex: 1;"><label>Wickets</label> <input type="number" id="wickets" value="0" onchange="processAndUpdate()"></div>
            <div style="flex: 1;"><label>Overs</label> <input type="text" id="overs" value="0.0" onchange="processAndUpdate()"></div>
        </div>
        <label>Target</label> <input type="text" id="targetMsg" value="1st Innings is going on..." readonly style="background: #e9ecef; font-weight: normal; font-size: 14px;">
    </div>

    <details class="box player-toggle-box" id="playerPanel" open>
        <summary>👥 Select Batters & Bowler (Mandatory)</summary>
        
        <div class="player-grid-3">
            <div class="box" style="border: 2px solid #ffc107; background: #fff;">
                <h3 style="color: #b78103;">Striker 🏏</h3>
                <label>Name</label> <input type="text" id="bat1Name" value="" placeholder="Select Striker" list="bat1Suggestions" autocomplete="off" onchange="validatePlayers()">
                <div class="small-flex">
                    <div style="flex: 1;"><label>Runs</label> <input type="number" id="bat1Runs" value="0" onchange="processAndUpdate()"></div>
                    <div style="flex: 1;"><label>Balls</label> <input type="number" id="bat1Balls" value="0" onchange="processAndUpdate()"></div>
                </div>
            </div>
            
            <div class="box" style="background: #fff;">
                <h3>Non-Striker</h3>
                <label>Name</label> <input type="text" id="bat2Name" value="" placeholder="Select Non-Striker" list="bat2Suggestions" autocomplete="off" onchange="validatePlayers()">
                <div class="small-flex">
                    <div style="flex: 1;"><label>Runs</label> <input type="number" id="bat2Runs" value="0" onchange="processAndUpdate()"></div>
                    <div style="flex: 1;"><label>Balls</label> <input type="number" id="bat2Balls" value="0" onchange="processAndUpdate()"></div>
                </div>
            </div>
            
            <div class="box" style="background: #fff;">
                <h3>Bowler</h3>
                <label>Name</label> <input type="text" id="bowlerName" value="" placeholder="Select Bowler" list="bowlerSuggestions" autocomplete="off" onchange="onBowlerNameChange()">
                <div class="small-flex">
                    <div style="flex: 1;"><label>Wkt</label> <input type="number" id="bWickets" value="0" onchange="processAndUpdate()"></div>
                    <div style="flex: 1;"><label>Run</label> <input type="number" id="bRuns" value="0" onchange="processAndUpdate()"></div>
                    <div style="flex: 1;"><label>Ov</label> <input type="text" id="bowlerOvers" value="0.0" onchange="processAndUpdate()"></div>
                </div>
            </div>
        </div>
    </details>

    <!-- Ball by Ball Update Panel -->
    <div class="box action-panel" style="margin-bottom: 12px;">
        <h3>⚡ Ball by Ball Update</h3>
        <div class="btn-grid">
            <button class="btn-action" onclick="addBall(0)">0</button>
            <button class="btn-action" onclick="addBall(1)">1</button>
            <button class="btn-action" onclick="addBall(2)">2</button>
            <button class="btn-action" onclick="addBall(3)">3</button>
            <button class="btn-action btn-4" onclick="addBall(4)">4</button>
            <button class="btn-action btn-6" onclick="addBall(6)">6</button>
            <button class="btn-action btn-wd" onclick="addExtra('WD')">WD</button>
            <button class="btn-action btn-nb" onclick="addExtra('NB')">NB</button>
            <button class="btn-action btn-lb" onclick="addLegBye()">LB/B</button>
            <button class="btn-action btn-w" onclick="openWicketModal()">W</button>
            <button class="btn-action btn-lbw" onclick="addLBW()">LBW</button>
            <button class="btn-action btn-ro" onclick="openRunOutModal()">Run Out</button>
        </div>
        
        <div class="flex-btns">
            <button class="btn-control-small btn-swap-s" onclick="swapStrike()">🔄 Swap</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4yHWFEhUPjff5zS71DUNFK21vtqapKSU",
        authDomain: "cricket-score-d187a.firebaseapp.com",
        databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
        projectId: "cricket-score-d187a",
        storageBucket: "cricket-score-d187a.firebasestorage.app",
        messagingSenderId: "782741896785",
        appId: "1:782741896785:web:78ab5ffe8c6a43ba928270",
        measurementId: "G-PHXZ72EC94"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const currentMatchUser = urlParams.get('u') || "default_user";
    let activeTournamentId = urlParams.get('t');
    const activeMatchId = urlParams.get('m');
    const urlTeam1 = urlParams.get('t1');
    const urlTeam2 = urlParams.get('t2');

    let isLeagueMatchGlobal = true;
    let tournamentPointsUpdated = false;
    
    let isSquadVisible = false;
    let isPointsTableVisible = false;
    let isSummaryVisible = false;
    let currentOverBalls = [];
    let legalBallsInCurrentOver = 0;
    let outPlayersList = [];
    let historyStack = [];
    let currentEvent = "";
    let overHistoryList = [];
    let autoInningsSwitched = false;
    let matchEnded = false;
    let bowlerSelectionPending = false;
    
    let lastBowler = ""; 
    let activeBowler = ""; 
    let bowlersRecord = {}; 

    let firstInningsRunsStored = 0;
    let firstInningsOversStored = "0.0";

    function cleanTeamName(name) {
        if (!name) return "";
        let decoded = decodeURIComponent(name).trim();
        let parts = decoded.split('\n');
        return parts[0].trim();
    }
    window.cleanTeamName = cleanTeamName;

    window.returnToTournamentImmediately = function() {
        if (activeTournamentId && activeTournamentId !== "null" && activeTournamentId !== "undefined") {
            window.location.href = `tournament.html?t=${activeTournamentId}&u=${currentMatchUser || ''}`;
        } else if (currentMatchUser) {
            window.location.href = `tournament.html?u=${currentMatchUser}`;
        } else {
            window.location.href = `tournament.html`;
        }
    };

    window.sendToFirebase = function(scoreData) {
        const btn = document.getElementById('updateBtn');
        if(btn) {
            btn.innerText = "⚡ Auto-Updating...";
            btn.style.background = "#17a2b8";
        }
        
        set(ref(db, 'matchScore/'), scoreData).then(() => {
            if(btn) {
                btn.innerText = "🟢 Live Update Active (Auto)";
                btn.style.background = "#28a745";
            }
        }).catch((error) => {
            console.error("Firebase Error: ", error);
            if(btn) {
                btn.innerText = "❌ Update Failed!";
                btn.style.background = "#dc3545";
            }
        });
    };

    async function markMatchCompletedInDatabase(winnerText, winnerTeamName) {
        try {
            if (activeTournamentId && activeMatchId && currentMatchUser) {
                const snap = await get(ref(db, 'usernames/' + currentMatchUser));
                let uid = snap.exists() ? snap.val() : currentMatchUser;
                await update(ref(db, `users/${uid}/tournaments/${activeTournamentId}/matches/${activeMatchId}`), {
                    status: 'completed',
                    winner: winnerTeamName || "",
                    resultText: winnerText || "Match Ended"
                });
            }
        } catch (err) {
            console.error("Error setting status completed:", err);
        }
    }

    window.updateTournamentStandings = async function(winnerTeam, loserTeam, matchRunsScored, matchOversBowled, matchRunsConceded, matchOversAgainst) {
        const pointsRef = ref(db, 'tournament/teams/');
        try {
            const snapshot = await get(pointsRef);
            let teamsData = snapshot.val() || {};

            let t1Key = "team1", t2Key = "team2";
            let defaultTeam1Name = cleanTeamName(document.getElementById('batTeamName').value) || "Team 1";
            let defaultTeam2Name = cleanTeamName(document.getElementById('bowlTeamName').value) || "Team 2";

            let t1Obj = teamsData[t1Key] || { name: defaultTeam1Name, matchesPlayed: 0, won: 0, lost: 0, points: 0, totalRunsScored: 0, totalOversFaced: 0, totalRunsConceded: 0, totalOversBowled: 0, netRunRate: "+0.000" };
            let t2Obj = teamsData[t2Key] || { name: defaultTeam2Name, matchesPlayed: 0, won: 0, lost: 0, points: 0, totalRunsScored: 0, totalOversFaced: 0, totalRunsConceded: 0, totalOversBowled: 0, netRunRate: "+0.000" };

            let winnerKey = cleanTeamName(t1Obj.name).toLowerCase().trim() === cleanTeamName(winnerTeam).toLowerCase().trim() ? t1Key : t2Key;
            let loserKey = winnerKey === t1Key ? t2Key : t1Key;

            let winObj = winnerKey === t1Key ? t1Obj : t2Obj;
            let loseObj = loserKey === t1Key ? t1Obj : t2Obj;

            winObj.name = cleanTeamName(winnerTeam);
            loseObj.name = cleanTeamName(loserTeam);

            winObj.matchesPlayed = (winObj.matchesPlayed || 0) + 1;
            
            if (winnerTeam === "Tied") {
                winObj.points = (winObj.points || 0) + 1;
                loseObj.points = (loseObj.points || 0) + 1;
            } else {
                winObj.won = (winObj.won || 0) + 1;
                winObj.points = (winObj.points || 0) + 2;
                loseObj.lost = (loseObj.lost || 0) + 1;
            }

            loseObj.matchesPlayed = (loseObj.matchesPlayed || 0) + 1;

            winObj.totalRunsScored = (winObj.totalRunsScored || 0) + matchRunsScored;
            winObj.totalOversFaced = (winObj.totalOversFaced || 0) + matchOversBowled;
            winObj.totalRunsConceded = (winObj.totalRunsConceded || 0) + matchRunsConceded;
            winObj.totalOversBowled = (winObj.totalOversBowled || 0) + matchOversAgainst;

            loseObj.totalRunsScored = (loseObj.totalRunsScored || 0) + matchRunsConceded;
            loseObj.totalOversFaced = (loseObj.totalOversFaced || 0) + matchOversAgainst;
            loseObj.totalRunsConceded = (loseObj.totalRunsConceded || 0) + matchRunsScored;
            loseObj.totalOversBowled = (loseObj.totalOversBowled || 0) + matchOversBowled;

            let winRunRate = winObj.totalOversFaced > 0 ? (winObj.totalRunsScored / winObj.totalOversFaced) - (winObj.totalRunsConceded / winObj.totalOversBowled) : 0;
            let loseRunRate = loseObj.totalOversFaced > 0 ? (loseObj.totalRunsScored / loseObj.totalOversFaced) - (loseObj.totalRunsConceded / loseObj.totalOversBowled) : 0;

            winObj.netRunRate = (winRunRate >= 0 ? "+" : "") + winRunRate.toFixed(3);
            loseObj.netRunRate = (loseRunRate >= 0 ? "+" : "") + loseRunRate.toFixed(3);

            teamsData[winnerKey] = winObj;
            teamsData[loserKey] = loseObj;

            await set(pointsRef, teamsData);
        } catch (error) {
            console.error("Points Update Error: ", error);
        }
    };

    window.savePointsToFirebase = function(teamsDataObj) {
        set(ref(db, 'tournament/teams/'), teamsDataObj).then(() => {
            alert("✅ Points table updated successfully!");
        }).catch((error) => {
            console.error("Points Update Error: ", error);
            alert("❌ Points table update failed!");
        });
    };

    async function initPage() {
        let loadedBatTeam = "";
        let loadedBowlTeam = "";
        let squad1 = "";
        let squad2 = "";

        if (urlTeam1) loadedBatTeam = cleanTeamName(urlTeam1);
        if (urlTeam2) loadedBowlTeam = cleanTeamName(urlTeam2);

        if (activeTournamentId && activeMatchId && currentMatchUser) {
            try {
                const userSnap = await get(ref(db, 'usernames/' + currentMatchUser));
                let uid = userSnap.exists() ? userSnap.val() : currentMatchUser;
                const tourSnap = await get(ref(db, `users/${uid}/tournaments/${activeTournamentId}`));
                if (tourSnap.exists()) {
                    const tData = tourSnap.val();
                    const matchInfo = (tData.matches || {})[activeMatchId];
                    if (matchInfo) {
                        if (!loadedBatTeam && matchInfo.team1) loadedBatTeam = cleanTeamName(matchInfo.team1);
                        if (!loadedBowlTeam && matchInfo.team2) loadedBowlTeam = cleanTeamName(matchInfo.team2);
                        if (matchInfo.overs) document.getElementById('totalOvers').value = matchInfo.overs;
                        isLeagueMatchGlobal = (matchInfo.type === 'league');
                    }
                    const teamsMap = tData.teams || {};
                    if (loadedBatTeam) {
                        for (let k in teamsMap) {
                            let tm = teamsMap[k];
                            if (cleanTeamName(tm.name).toLowerCase() === loadedBatTeam.toLowerCase()) {
                                if (tm.players && Array.isArray(tm.players)) {
                                    squad1 = [tm.name, ...tm.players].join('\n');
                                }
                                break;
                            }
                        }
                    }
                    if (loadedBowlTeam) {
                        for (let k in teamsMap) {
                            let tm = teamsMap[k];
                            if (cleanTeamName(tm.name).toLowerCase() === loadedBowlTeam.toLowerCase()) {
                                if (tm.players && Array.isArray(tm.players)) {
                                    squad2 = [tm.name, ...tm.players].join('\n');
                                }
                                break;
                            }
                        }
                    }
                }
            } catch (err) {
                console.error("Error reading match info:", err);
            }
        }

        if (!loadedBatTeam) loadedBatTeam = cleanTeamName(localStorage.getItem('tempSelectedBatTeamName') || "Team 1");
        if (!loadedBowlTeam) loadedBowlTeam = cleanTeamName(localStorage.getItem('tempSelectedBowlTeamName') || "Team 2");

        if(!squad1) squad1 = localStorage.getItem('tempSelectedBatTeamSquad') || "";
        if(!squad2) squad2 = localStorage.getItem('tempSelectedBowlTeamSquad') || "";

        document.getElementById('batTeamName').value = loadedBatTeam;
        document.getElementById('bowlTeamName').value = loadedBowlTeam;

        if(squad1) localStorage.setItem('tempSelectedBatTeamSquad', squad1);
        if(squad2) localStorage.setItem('tempSelectedBowlTeamSquad', squad2);

        loadControllerState();
        updateSuggestions();
        processAndUpdate();
    }

    window.onload = function() {
        initPage();
    };

    function autoClosePanel() {
        let b1 = document.getElementById('bat1Name').value.trim();
        let b2 = document.getElementById('bat2Name').value.trim();
        let bowler = document.getElementById('bowlerName').value.trim();
        
        if (b1 !== "" && b2 !== "" && bowler !== "" && !bowlerSelectionPending) {
            document.getElementById('playerPanel').open = false;
        }
    }

    window.onBowlerNameChange = function() {
        let bowler = document.getElementById('bowlerName').value.trim();
        let bat1 = document.getElementById('bat1Name').value.trim();
        let bat2 = document.getElementById('bat2Name').value.trim();

        if (!bat1 || !bat2) {
            alert("⚠️ First select both batters, then you can select a bowler!");
            document.getElementById('bowlerName').value = "";
            document.getElementById('playerPanel').open = true;
            return;
        }

        if (bowler !== "" && bowler === lastBowler) {
            alert("⚠️ The same bowler cannot bowl two consecutive overs! Please select another bowler.");
            document.getElementById('bowlerName').value = "";
            document.getElementById('playerPanel').open = true;
            updateSuggestions();
            return;
        }

        if(bowler !== "") {
            if (bowlersRecord[bowler]) {
                setVal('bWickets', bowlersRecord[bowler].wickets);
                setVal('bRuns', bowlersRecord[bowler].runs);
                document.getElementById('bowlerOvers').value = bowlersRecord[bowler].overs;
            } else {
                setVal('bWickets', 0);
                setVal('bRuns', 0);
                document.getElementById('bowlerOvers').value = "0.0";
            }
            
            activeBowler = bowler;
            bowlerSelectionPending = false;
        }
        processAndUpdate();
        autoClosePanel();
    }

    function getPlayersByTeamName(teamName) {
        const sBat = localStorage.getItem('tempSelectedBatTeamSquad') || "";
        const sBowl = localStorage.getItem('tempSelectedBowlTeamSquad') || "";
        
        let t1Lines = sBat.split('\n').map(p => p.trim()).filter(p => p.length > 0);
        let t2Lines = sBowl.split('\n').map(p => p.trim()).filter(p => p.length > 0);
        
        let t1Name = t1Lines.length > 0 ? cleanTeamName(t1Lines[0]).toLowerCase() : "";
        let t2Name = t2Lines.length > 0 ? cleanTeamName(t2Lines[0]).toLowerCase() : "";
        let currentTeam = cleanTeamName(teamName).toLowerCase();

        if(currentTeam === t1Name || t1Name.includes(currentTeam) || currentTeam.includes(t1Name)) { 
            return t1Lines.slice(1); 
        }
        else if(currentTeam === t2Name || t2Name.includes(currentTeam) || currentTeam.includes(t2Name)) { 
            return t2Lines.slice(1); 
        }
        
        if (t1Lines.length > 1) return t1Lines.slice(1);
        if (t2Lines.length > 1) return t2Lines.slice(1);
        return [];
    }

    function updateSuggestions() {
        const batTeam = cleanTeamName(document.getElementById('batTeamName').value);
        const bowlTeam = cleanTeamName(document.getElementById('bowlTeamName').value);
        const battingPlayers = getPlayersByTeamName(batTeam);
        const bowlingPlayers = getPlayersByTeamName(bowlTeam);

        const bat1Val = document.getElementById('bat1Name').value.trim();
        const bat2Val = document.getElementById('bat2Name').value.trim();

        const bowlerList = document.getElementById('bowlerSuggestions');
        bowlerList.innerHTML = '';
        bowlingPlayers.forEach(player => {
            if (player !== lastBowler) {
                let opt = document.createElement('option'); opt.value = player; bowlerList.appendChild(opt);
            }
        });

        const bat1List = document.getElementById('bat1Suggestions');
        bat1List.innerHTML = '';
        battingPlayers.forEach(player => {
            if (player !== bat2Val && !outPlayersList.includes(player)) {
                let opt = document.createElement('option'); opt.value = player; bat1List.appendChild(opt);
            }
        });

        const bat2List = document.getElementById('bat2Suggestions');
        bat2List.innerHTML = '';
        battingPlayers.forEach(player => {
            if (player !== bat1Val && !outPlayersList.includes(player)) {
                let opt = document.createElement('option'); opt.value = player; bat2List.appendChild(opt);
            }
        });
    }

    window.validatePlayers = function() {
        const b1 = document.getElementById('bat1Name').value.trim();
        const b2 = document.getElementById('bat2Name').value.trim();
        if (outPlayersList.includes(b1) || outPlayersList.includes(b2)) {
            alert("⚠️ An out player cannot be sent to bat again.");
            return;
        }
        if(b1 !== "" && b2 !== "" && b1 === b2) {
            alert("⚠️ The same player cannot be in both positions!");
            document.getElementById('bat2Name').value = "";
        }
        updateSuggestions();
        processAndUpdate();
        autoClosePanel();
    }

    window.swapTeams = function() {
        saveState();
        let batTeam = cleanTeamName(document.getElementById('batTeamName').value);
        let bowlTeam = cleanTeamName(document.getElementById('bowlTeamName').value);
        document.getElementById('batTeamName').value = bowlTeam;
        document.getElementById('bowlTeamName').value = batTeam;

        let sBat = localStorage.getItem('tempSelectedBatTeamSquad') || "";
        let sBowl = localStorage.getItem('tempSelectedBowlTeamSquad') || "";
        localStorage.setItem('tempSelectedBatTeamSquad', sBowl);
        localStorage.setItem('tempSelectedBowlTeamSquad', sBat);

        updateSuggestions();
        document.getElementById('playerPanel').open = true;
        processAndUpdate();
    }

    function loadControllerState() {
        const storedData = localStorage.getItem('localCricketLive');
        if (storedData) {
            try {
                const data = JSON.parse(storedData);
                isLeagueMatchGlobal = (data.isLeagueMatch !== undefined) ? data.isLeagueMatch : true;
                tournamentPointsUpdated = data.tournamentPointsUpdated || false;

                if(data.batTeamName) document.getElementById('batTeamName').value = cleanTeamName(data.batTeamName);
                if(data.bowlTeamName) document.getElementById('bowlTeamName').value = cleanTeamName(data.bowlTeamName);
                document.getElementById('runs').value = data.runs || 0;
                document.getElementById('wickets').value = data.wickets || 0;
                document.getElementById('overs').value = data.overs || "0.0";
                if(data.totalOvers) document.getElementById('totalOvers').value = data.totalOvers;
                document.getElementById('targetMsg').value = data.target || "1st Innings is going on...";
                document.getElementById('bat1Name').value = data.bat1Name || "";
                document.getElementById('bat1Runs').value = data.bat1Runs || 0;
                document.getElementById('bat1Balls').value = data.bat1Balls || 0;
                document.getElementById('bat2Name').value = data.bat2Name || "";
                document.getElementById('bat2Runs').value = data.bat2Runs || 0;
                document.getElementById('bat2Balls').value = data.bat2Balls || 0;
                document.getElementById('bowlerName').value = data.bowlerName || "";
                let figParts = (data.bowlerFig || "0-0").split('-');
                document.getElementById('bWickets').value = figParts[0] || 0;
                document.getElementById('bRuns').value = figParts[1] || 0;
                document.getElementById('bowlerOvers').value = data.bowlerOvers || "0.0";
                
                if (data.currentOverBalls) currentOverBalls = [...data.currentOverBalls];
                if (data.outPlayers) outPlayersList = [...data.outPlayers];
                if (data.overHistory) overHistoryList = [...data.overHistory];
                if (data.firstInningsRuns) firstInningsRunsStored = data.firstInningsRuns;
                if (data.firstInningsOvers) firstInningsOversStored = data.firstInningsOvers;
                
                lastBowler = data.lastBowler || ""; 
                activeBowler = data.activeBowler || ""; 
                bowlersRecord = data.bowlersRecord || {};
                
                isSquadVisible = data.showSquadsOnScreen || false;
                isPointsTableVisible = data.showPointsTableOnScreen || false;
                isSummaryVisible = data.showSummaryOnScreen || false;
                
                updateToggleButtonsUI();
                autoClosePanel();
            } catch (err) {
                console.error("Error loading state:", err);
            }
        }
        updateSuggestions();
    }

    window.toggleSquadDisplay = function() {
        isSquadVisible = !isSquadVisible;
        if(isSquadVisible) { isPointsTableVisible = false; isSummaryVisible = false; }
        updateToggleButtonsUI();
        currentEvent = ""; processAndUpdate();
    }

    window.togglePointsTableDisplay = function() {
        isPointsTableVisible = !isPointsTableVisible;
        if(isPointsTableVisible) { isSquadVisible = false; isSummaryVisible = false; }
        updateToggleButtonsUI();
        currentEvent = ""; processAndUpdate();
    }

    window.toggleSummaryDisplay = function() {
        isSummaryVisible = !isSummaryVisible;
        if(isSummaryVisible) { isSquadVisible = false; isPointsTableVisible = false; }
        updateToggleButtonsUI();
        currentEvent = ""; processAndUpdate();
    }

    function updateToggleButtonsUI() {
        const sBtn = document.getElementById('squadShowBtn');
        const pBtn = document.getElementById('pointsShowBtn');
        const sumBtn = document.getElementById('summaryShowBtn');

        if(sBtn) {
            sBtn.style.background = isSquadVisible ? "#dc3545" : "#6f42c1";
            sBtn.innerText = isSquadVisible ? "📺 Squads [ON]" : "📺 Squads";
        }
        if(pBtn) {
            pBtn.style.background = isPointsTableVisible ? "#dc3545" : "#27ae60";
            pBtn.innerText = isPointsTableVisible ? "📊 Points [ON]" : "📊 Points";
        }
        if(sumBtn) {
            sumBtn.style.background = isSummaryVisible ? "#dc3545" : "#27ae60";
            sumBtn.innerText = isSummaryVisible ? "📋 Summary [ON]" : "📋 Summary";
        }
    }

    function getVal(id) { return parseInt(document.getElementById(id).value) || 0; }
    function setVal(id, val) { document.getElementById(id).value = val; }

    function validateMandatorySelections() {
        let bat1 = document.getElementById('bat1Name').value.trim();
        let bat2 = document.getElementById('bat2Name').value.trim();
        let bowler = document.getElementById('bowlerName').value.trim();

        if (!bat1 || !bat2) {
            alert("⚠️ Selecting both batters is mandatory!");
            document.getElementById('playerPanel').open = true;
            return false;
        }

        if (!bowler || bowler === "Bowler") {
            alert("⚠️️ Selecting the current bowler is mandatory!");
            document.getElementById('playerPanel').open = true;
            return false;
        }

        if (bowlerSelectionPending) {
            alert("⚠️ Over finished! Please select a new bowler for the next over.");
            document.getElementById('playerPanel').open = true;
            return false;
        }
        return true;
    }

    function saveState() {
        historyStack.push({
            innings: document.getElementById('innings').value, totalOvers: document.getElementById('totalOvers').value,
            batTeamName: cleanTeamName(document.getElementById('batTeamName').value), bowlTeamName: cleanTeamName(document.getElementById('bowlTeamName').value), 
            runs: document.getElementById('runs').value, wickets: document.getElementById('wickets').value, overs: document.getElementById('overs').value,
            targetMsg: document.getElementById('targetMsg').value, bowlerName: document.getElementById('bowlerName').value,
            bWickets: document.getElementById('bWickets').value, bRuns: document.getElementById('bRuns').value,
            bowlerOvers: document.getElementById('bowlerOvers').value, bat1Name: document.getElementById('bat1Name').value,
            bat1Runs: document.getElementById('bat1Runs').value, bat1Balls: document.getElementById('bat1Balls').value,
            bat2Name: document.getElementById('bat2Name').value, bat2Runs: document.getElementById('bat2Runs').value,
            bat2Balls: document.getElementById('bat2Balls').value, currentOverBalls: [...currentOverBalls],
            legalBallsInCurrentOver: legalBallsInCurrentOver, outPlayers: [...outPlayersList], overHistory: [...overHistoryList],
            lastBowler: lastBowler, activeBowler: activeBowler, bowlersRecord: JSON.parse(JSON.stringify(bowlersRecord)),
            isLeagueMatch: isLeagueMatchGlobal, tournamentPointsUpdated: tournamentPointsUpdated
        });
        if(historyStack.length > 1000) historyStack.shift();
    }

    window.undoAction = function() {
        if(historyStack.length > 0) {
            const state = historyStack.pop();
            document.getElementById('innings').value = state.innings; document.getElementById('totalOvers').value = state.totalOvers;
            document.getElementById('batTeamName').value = cleanTeamName(state.batTeamName); document.getElementById('bowlTeamName').value = cleanTeamName(state.bowlTeamName); 
            document.getElementById('runs').value = state.runs; document.getElementById('wickets').value = state.wickets; document.getElementById('overs').value = state.overs;
            document.getElementById('targetMsg').value = state.targetMsg; document.getElementById('bowlerName').value = state.bowlerName;
            document.getElementById('bWickets').value = state.bWickets; document.getElementById('bRuns').value = state.bRuns;
            document.getElementById('bowlerOvers').value = state.bowlerOvers; document.getElementById('bat1Name').value = state.bat1Name;
            document.getElementById('bat1Runs').value = state.bat1Runs; document.getElementById('bat1Balls').value = state.bat1Balls;
            document.getElementById('bat2Name').value = state.bat2Name; document.getElementById('bat2Runs').value = state.bat2Runs;
            document.getElementById('bat2Balls').value = state.bat2Balls; currentOverBalls = [...state.currentOverBalls];
            legalBallsInCurrentOver = state.legalBallsInCurrentOver; outPlayersList = [...state.outPlayers]; overHistoryList = [...state.overHistory];
            lastBowler = state.lastBowler; activeBowler = state.activeBowler; bowlersRecord = state.bowlersRecord;
            isLeagueMatchGlobal = state.isLeagueMatch; tournamentPointsUpdated = state.tournamentPointsUpdated;
            currentEvent = ""; matchEnded = false; processAndUpdate();
        } else {
            alert("⚠️ No more undo possible, you are at the very beginning of the innings!");
        }
        updateSuggestions();
    }

    function convertOversToBalls(oversStr) {
        let parts = String(oversStr).split('.');
        let o = parseInt(parts[0]) || 0, b = parseInt(parts[1]) || 0;
        return (o * 6) + b;
    }

    function convertBallsToOversStr(totalBalls) {
        let o = Math.floor(totalBalls / 6), b = totalBalls % 6;
        return `${o}.${b}`;
    }

    function checkAndSwitchInnings() {
        let innings = document.getElementById('innings').value;
        let totalOvers = getVal('totalOvers');
        let currentOversStr = document.getElementById('overs').value;
        let parts = currentOversStr.split('.');
        let completedOvers = parseInt(parts[0]) || 0;
        let wickets = getVal('wickets');
        let runs = getVal('runs');
        let targetMsg = document.getElementById('targetMsg').value;

        let batTeamNameClean = cleanTeamName(document.getElementById('batTeamName').value);
        let bowlTeamNameClean = cleanTeamName(document.getElementById('bowlTeamName').value);

        if (innings === "2" && !matchEnded) {
            let targetNum = 9999;
            
            if (targetMsg.includes("Target:")) {
                targetNum = parseInt(targetMsg.match(/Target:\s*(\d+)/)[1]);
                if (runs >= targetNum) {
                    matchEnded = true;
                    let wicketsRemaining = 10 - wickets;
                    let winnerText = `${batTeamNameClean} Won by ${wicketsRemaining} Wickets! 🎉`;
                    document.getElementById('targetMsg').value = winnerText;
                    currentEvent = "WINNER";
                    
                    let ballsPlayed = convertOversToBalls(document.getElementById('overs').value);
                    let ballsRemaining = (totalOvers * 6) - ballsPlayed;

                    if(isLeagueMatchGlobal && !tournamentPointsUpdated) {
                        let firstOversBalls = convertOversToBalls(firstInningsOversStored);
                        window.updateTournamentStandings(batTeamNameClean, bowlTeamNameClean, runs, convertBallsToOversStr(ballsPlayed), firstInningsRunsStored, convertBallsToOversStr(firstOversBalls));
                        tournamentPointsUpdated = true;
                    }
                    processAndUpdate(); 
                    markMatchCompletedInDatabase(winnerText, batTeamNameClean);
                    showMatchResultPopup(`🎉 ${winnerText}\n\n🏆 Winner: ${batTeamNameClean}\n🏏 Balls Played (2nd Inn): ${ballsPlayed}\n🎯 Balls Remaining: ${ballsRemaining}`);
                    return true;
                }
            }
            
            if (completedOvers >= totalOvers || wickets >= 10) {
                matchEnded = true;
                let winnerText = "";
                let winTeamName = bowlTeamNameClean;
                if(runs === targetNum - 1) {
                    winnerText = `Match Tied! 🤝`;
                    winTeamName = "Tied";
                } else {
                    let runsNeeded = targetNum - runs;
                    winnerText = `${bowlTeamNameClean} Won by ${runsNeeded} Runs! 🏆`;
                }
                
                document.getElementById('targetMsg').value = winnerText;
                currentEvent = "WINNER";
                
                let ballsPlayed = convertOversToBalls(document.getElementById('overs').value);

                if(isLeagueMatchGlobal && !tournamentPointsUpdated) {
                    let totalBallsAllowed = totalOvers * 6;
                    let firstOversBalls = convertOversToBalls(firstInningsOversStored);
                    let winTeam = (runs === targetNum - 1) ? "Tied" : bowlTeamNameClean;
                    let loseTeam = (runs === targetNum - 1) ? "Tied" : batTeamNameClean;
                    window.updateTournamentStandings(winTeam, loseTeam, firstInningsRunsStored, convertBallsToOversStr(firstOversBalls), runs, convertBallsToOversStr(totalBallsAllowed));
                    tournamentPointsUpdated = true;
                }
                processAndUpdate(); 
                markMatchCompletedInDatabase(winnerText, winTeamName);
                if(winnerText.includes("Tied")) {
                    showMatchResultPopup(`🤝 ${winnerText}\n\n🏏 Both teams scored ${runs} runs.`);
                } else {
                    showMatchResultPopup(`🎉 ${winnerText}\n\n🏆 Winner: ${bowlTeamNameClean}\n🏏 ${batTeamNameClean} played ${ballsPlayed} balls.`);
                }
                return true;
            }
        }

        if (innings === "1" && !autoInningsSwitched && !matchEnded) {
            if (completedOvers >= totalOvers || wickets >= 10) {
                autoInningsSwitched = true;
                let currentRuns = getVal('runs'); let currentWickets = getVal('wickets');
                firstInningsRunsStored = currentRuns; firstInningsOversStored = currentOversStr;

                document.getElementById('popupInningsDetails').innerText = `${batTeamNameClean}: ${currentRuns}/${currentWickets} (${currentOversStr} Overs)`;
                document.getElementById('inningsPopupModal').style.display = 'flex';
                
                let targetRuns = currentRuns + 1;
                document.getElementById('targetMsg').value = `Target: ${targetRuns}`;
                currentEvent = "INNINGS_BREAK";
                processAndUpdate();
                return true;
            }
        }
        return false;
    }

    function checkAndTriggerOverEnd() {
        let overEnded = false;
        if (legalBallsInCurrentOver >= 6) {
            overEnded = true;
            let currentOversStr = document.getElementById('overs').value;
            let completedOverNo = currentOversStr.split('.')[0];
            overHistoryList.push({ over: completedOverNo, totalRuns: getVal('runs'), totalWickets: getVal('wickets') });

            let totalOvers = getVal('totalOvers');
            let completedOversCount = parseInt(completedOverNo) || 0;
            let innings = document.getElementById('innings').value;

            if (innings === "1" && completedOversCount >= totalOvers) { 
                currentEvent = "INNINGS_BREAK"; 
            } else { 
                currentEvent = "OVER_END"; 
            }

            currentOverBalls = []; legalBallsInCurrentOver = 0; bowlerSelectionPending = true;
        }

        let stateEnded = checkAndSwitchInnings(); 
        let isFirstInningsPopupOpen = (document.getElementById('inningsPopupModal').style.display === 'flex');

        if (overEnded && !matchEnded && !isFirstInningsPopupOpen) {
            lastBowler = document.getElementById('bowlerName').value.trim();
            document.getElementById('bowlerName').value = ""; activeBowler = ""; 
            
            document.getElementById('playerPanel').open = true; 
            
            processAndUpdate(); 
            updateSuggestions();
            
            setTimeout(() => {
                alert("🎯 Over ended! Select the name of the new bowler for the next over.");
                const bowlerInput = document.getElementById('bowlerName');
                bowlerInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                bowlerInput.focus();
            }, 200);
        }
    }

    window.declareWinnerManually = function() {
        if(!confirm("⚠️ Are you sure you want to END the match manually?")) return;

        let batTeam = cleanTeamName(document.getElementById('batTeamName').value);
        let bowlTeam = cleanTeamName(document.getElementById('bowlTeamName').value);
        let runs = getVal('runs');
        let wickets = getVal('wickets');
        let targetMsg = document.getElementById('targetMsg').value;
        let totalOversAllowed = parseInt(document.getElementById('totalOvers').value) || 10;
        let totalBallsAllowed = totalOversAllowed * 6;
        let ballsPlayed = convertOversToBalls(document.getElementById('overs').value);
        let ballsRemaining = totalBallsAllowed - ballsPlayed;

        let winnerText = "";
        let winningTeam = batTeam;
        let losingTeam = bowlTeam;
        let detailedSummary = "";

        if (targetMsg.includes("Won")) {
            winnerText = targetMsg;
            detailedSummary = `🎉 ${winnerText}\n\n🏏 Balls Played: ${ballsPlayed}\n🎯 Balls Remaining: ${ballsRemaining >= 0 ? ballsRemaining : 0}`;
        } else if (targetMsg.includes("Target:")) {
            let targetNum = parseInt(targetMsg.match(/Target:\s*(\d+)/)[1]);
            
            if (runs >= targetNum) {
                let wicketsRemaining = 10 - wickets;
                winnerText = `${batTeam} Won by ${wicketsRemaining} Wickets! 🎉`;
                winningTeam = batTeam; losingTeam = bowlTeam;
                detailedSummary = `🎉 ${winnerText}\n\n🏆 Winner: ${batTeam}\n🏏 Balls Played (2nd Inn): ${ballsPlayed}\n🎯 Balls Remaining: ${ballsRemaining}`;
            } else if (runs === targetNum - 1) {
                winnerText = `Match Tied! 🤝`;
                winningTeam = "Tied"; losingTeam = "Tied";
                detailedSummary = `🤝 ${winnerText}\n\n🏏 Both teams scored ${runs} runs.\n🏏 Balls Played (2nd Inn): ${ballsPlayed}\n🎯 Balls Remaining: ${ballsRemaining}`;
            } else {
                let runsNeeded = targetNum - runs;
                winnerText = `${bowlTeam} Won by ${runsNeeded} Runs! 🏆`;
                winningTeam = bowlTeam; losingTeam = batTeam;
                detailedSummary = `🎉 ${winnerText}\n\n🏆 Winner: ${bowlTeam}\n🏏 ${batTeam} played ${ballsPlayed} balls.`;
            }

            if(isLeagueMatchGlobal && !tournamentPointsUpdated) {
                let firstOversBalls = convertOversToBalls(firstInningsOversStored);
                let t1Runs = winningTeam === batTeam ? runs : firstInningsRunsStored;
                let t1OversFaced = winningTeam === batTeam ? ballsPlayed : firstOversBalls;
                let t2Runs = winningTeam === batTeam ? firstInningsRunsStored : runs;
                let t2OversFaced = winningTeam === batTeam ? firstOversBalls : ballsPlayed;
                window.updateTournamentStandings(winningTeam, losingTeam, t1Runs, convertBallsToOversStr(t1OversFaced), t2Runs, convertBallsToOversStr(t2OversFaced));
                tournamentPointsUpdated = true;
            }
        } else {
            winnerText = `Match Ended Early!`;
            detailedSummary = `Match ended prematurely during the 1st Innings.\n🏏 Balls Played: ${ballsPlayed}`;
        }

        document.getElementById('targetMsg').value = winnerText;
        matchEnded = true;
        currentEvent = "WINNER";
        
        processAndUpdate(); 
        markMatchCompletedInDatabase(winnerText, winningTeam);
        showMatchResultPopup(detailedSummary);
    }

    function updateTargetMessage() {
        let innings = document.getElementById('innings').value;
        let msgField = document.getElementById('targetMsg');
        if(matchEnded) return;

        if(innings === "1") { 
            msgField.value = "1st Innings is going on..."; 
            checkAndSwitchInnings();
            return; 
        }
        
        if (!msgField.value.includes("Target:") && !msgField.value.includes("Won") && !msgField.value.includes("Tied")) {
            let currentRuns = getVal('runs');
            msgField.value = `Target: ${currentRuns + 1}`;
        }
    }

    function incrementOver(currentOvers) {
        let parts = String(currentOvers).split('.');
        let o = parseInt(parts[0]) || 0, b = parseInt(parts[1]) || 0;
        b++; if (b >= 6) { o++; b = 0; } return `${o}.${b}`;
    }

    function swapStrikeInternal() {
        let b1N = document.getElementById('bat1Name').value, b1R = getVal('bat1Runs'), b1B = getVal('bat1Balls');
        let b2N = document.getElementById('bat2Name').value, b2R = getVal('bat2Runs'), b2B = getVal('bat2Balls');
        document.getElementById('bat1Name').value = b2N; setVal('bat1Runs', b2R); setVal('bat1Balls', b2B);
        document.getElementById('bat2Name').value = b1N; setVal('bat2Runs', b1R); setVal('bat2Balls', b1B);
        updateSuggestions();
    }

    window.swapStrike = function() {
        if(!validateMandatorySelections()) return;
        autoClosePanel();
        saveState(); swapStrikeInternal(); currentEvent = ""; processAndUpdate();
    }

    window.addBall = function(runs) {
        if(matchEnded) { alert("⚠️ The match has already ended!"); return; }
        if(!validateMandatorySelections()) return;
        autoClosePanel();
        
        saveState();
        setVal('runs', getVal('runs') + runs); setVal('bat1Runs', getVal('bat1Runs') + runs);
        setVal('bat1Balls', getVal('bat1Balls') + 1); setVal('bRuns', getVal('bRuns') + runs);
       
        let newOver = incrementOver(document.getElementById('overs').value);
        setVal('overs', newOver); setVal('bowlerOvers', incrementOver(document.getElementById('bowlerOvers').value));
       
        if (runs === 1 || runs === 3) swapStrikeInternal();
        if (newOver.endsWith('.0')) swapStrikeInternal();

        let ballLabel = runs === 0 ? "•" : String(runs);
        if (runs === 4) { ballLabel = "4"; currentEvent = "FOUR"; }
        else if (runs === 6) { ballLabel = "6"; currentEvent = "SIX"; }
        else { currentEvent = ""; }
       
        currentOverBalls.push(ballLabel); legalBallsInCurrentOver++;
       
        processAndUpdate(); 
        checkAndTriggerOverEnd();
    }

    function processAndUpdate() {
        if(activeBowler !== "") {
            bowlersRecord[activeBowler] = { wickets: getVal('bWickets'), runs: getVal('bRuns'), overs: document.getElementById('bowlerOvers').value };
        }

        updateTargetMessage(); updateSuggestions();
       
        const scoreData = {
            batTeamName: cleanTeamName(document.getElementById('batTeamName').value), bowlTeamName: cleanTeamName(document.getElementById('bowlTeamName').value),
            runs: document.getElementById('runs').value, wickets: document.getElementById('wickets').value,
            overs: document.getElementById('overs').value, totalOvers: document.getElementById('totalOvers').value,
            target: document.getElementById('targetMsg').value, bat1Name: document.getElementById('bat1Name').value,

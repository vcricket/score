<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Management - Pro Cricket</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 850px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header-nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .btn-back { background: #6c757d; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; }
        h2 { color: #333; margin: 0; font-family: 'Oswald', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
        .box { background: #f9f9f9; padding: 18px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 10px; font-size: 14px; color: #444; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; font-family: inherit; }
        .btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .btn:hover { background: #218838; }

        /* লিস্ট কার্ড স্টাইল */
        .list-group { list-style: none; padding: 0; margin-top: 10px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); flex-wrap: wrap; gap: 10px; }
        .btn-launch { background: #007bff; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 13px; }
        .btn-launch:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <h2 id="tourTitleDisplay">🏆 Tournament Dashboard</h2>
        <a id="backToDash" href="index.html" class="btn-back">⬅️ Back to Dashboard</a>
    </div>

    <!-- ১. টিম ও স্কোয়াড যোগ করার বক্স -->
    <div class="box">
        <h3 style="color: #0056b3; margin-top: 0;">👥 Add Team & Squad</h3>
        <label>Team Name</label>
        <input type="text" id="teamNameInput" placeholder="e.g. Royal Challengers">
        <label>Players List (One player name per line)</label>
        <textarea id="teamSquadInput" rows="4" placeholder="Player 1 (C)\nPlayer 2 (WK)\nPlayer 3..."></textarea>
        <button class="btn" style="background: #17a2b8;" onclick="window.saveTeamAndSquad()">Save Team & Squad</button>
    </div>

    <!-- ২. ম্যাচ শিডিউল করার বক্স -->
    <div class="box">
        <h3 style="color: #28a745; margin-top: 0;">📅 Schedule New Match</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 200px;">
                <label>Select Team 1 (Batting First)</label>
                <select id="matchTeam1Select"><option value="">-- Select Team --</option></select>
            </div>
            <div style="flex: 1; min-width: 200px;">
                <label>Select Team 2 (Bowling First)</label>
                <select id="matchTeam2Select"><option value="">-- Select Team --</option></select>
            </div>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
            <div style="flex: 1; min-width: 150px;">
                <label>Total Overs</label>
                <input type="number" id="matchOversInput" value="10">
            </div>
            <div style="flex: 1; min-width: 150px;">
                <label>Match Type</label>
                <select id="matchTypeSelect">
                    <option value="league">League Match</option>
                    <option value="knockout">Knockout / Final</option>
                </select>
            </div>
        </div>
        <button class="btn" onclick="window.scheduleMatch()">Schedule & Ready Match</button>
    </div>

    <!-- ৩. শিডিউল করা ম্যাচগুলোর তালিকা ও লঞ্চার -->
    <div class="box">
        <h3 style="color: #333; margin-top: 0;">📋 Scheduled Matches</h3>
        <ul id="matchesListContainer" class="list-group">
            <li style="text-align:center; color:#888;">Loading matches...</li>
        </ul>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getDatabase, ref, set, get, push } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4yHWFEhUPjff5zS71DUNFK21vtqapKSU",
        authDomain: "cricket-score-d187a.firebaseapp.com",
        databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
        projectId: "cricket-score-d187a",
        storageBucket: "cricket-score-d187a.firebasestorage.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const tournamentId = urlParams.get('t');
    const currentUsername = urlParams.get('u') || localStorage.getItem('proCricketUsername');

    if (!tournamentId || !currentUsername) {
        alert("⚠️ Invalid access! Please select a tournament from dashboard.");
        window.location.href = "index.html";
    }

    document.getElementById('backToDash').href = `index.html?u=${currentUsername}`;

    let userId = "";

    async function initTournamentPage() {
        try {
            const userSnap = await get(ref(db, 'usernames/' + currentUsername));
            if (userSnap.exists()) {
                userId = userSnap.val();
                
                // টুর্নামেন্টের নাম লোড করা
                const tourSnap = await get(ref(db, `users/${userId}/tournaments/${tournamentId}/name`));
                if (tourSnap.exists()) {
                    document.getElementById('tourTitleDisplay').innerText = `🏆 ${tourSnap.val()}`;
                }

                loadTeamsAndMatches();
            }
        } catch (err) {
            console.error("Error loading tournament:", err);
        }
    }

    window.saveTeamAndSquad = async function() {
        const teamName = document.getElementById('teamNameInput').value.trim();
        const squadText = document.getElementById('teamSquadInput').value.trim();

        if (!teamName || !squadText) {
            alert("⚠️ Please enter team name and players squad!");
            return;
        }

        try {
            await set(ref(db, `users/${userId}/tournaments/${tournamentId}/teams/${teamName}`), squadText);
            alert(`✅ Team "${teamName}" saved successfully!`);
            document.getElementById('teamNameInput').value = "";
            document.getElementById('teamSquadInput').value = "";
            loadTeamsAndMatches();
        } catch (err) {
            console.error("Error saving team:", err);
            alert("❌ Failed to save team.");
        }
    };

    window.scheduleMatch = async function() {
        const t1 = document.getElementById('matchTeam1Select').value;
        const t2 = document.getElementById('matchTeam2Select').value;
        const overs = document.getElementById('matchOversInput').value;
        const type = document.getElementById('matchTypeSelect').value;

        if (!t1 || !t2) {
            alert("⚠️ Please select both teams!");
            return;
        }
        if (t1 === t2) {
            alert("⚠️ Both teams cannot be the same!");
            return;
        }

        try {
            const newMatchRef = push(ref(db, `users/${userId}/tournaments/${tournamentId}/matches`));
            await set(newMatchRef, {
                team1: t1,
                team2: t2,
                overs: overs,
                type: type,
                status: 'scheduled',
                createdAt: Date.now()
            });
            alert("📅 Match scheduled successfully!");
            loadTeamsAndMatches();
        } catch (err) {
            console.error("Error scheduling match:", err);
            alert("❌ Failed to schedule match.");
        }
    };

    async function loadTeamsAndMatches() {
        try {
            const tourRef = ref(db, `users/${userId}/tournaments/${tournamentId}`);
            const snap = await get(tourRef);

            if (snap.exists()) {
                const tourData = snap.val();
                
                // টিম ড্রপডাউন পপুলেট করা
                const teams = tourData.teams || {};
                const t1Select = document.getElementById('matchTeam1Select');
                const t2Select = document.getElementById('matchTeam2Select');
                t1Select.innerHTML = '<option value="">-- Select Team --</option>';
                t2Select.innerHTML = '<option value="">-- Select Team --</option>';

                Object.keys(teams).forEach(tName => {
                    t1Select.innerHTML += `<option value="${tName}">${tName}</option>`;
                    t2Select.innerHTML += `<option value="${tName}">${tName}</option>`;
                });

                // ম্যাচ লিস্ট লোড করা
                const matches = tourData.matches || {};
                const mContainer = document.getElementById('matchesListContainer');
                mContainer.innerHTML = "";

                if (Object.keys(matches).length > 0) {
                    Object.keys(matches).forEach(mId => {
                        const m = matches[mId];
                        let li = document.createElement('li');
                        li.className = "list-item";
                        
                        let controllerLink = `controller.html?u=${currentUsername}&t=${tournamentId}&m=${mId}`;
                        
                        li.innerHTML = `
                            <div>
                                <strong>${m.team1} vs ${m.team2}</strong><br>
                                <span style="font-size:12px; color:#666;">Overs: ${m.overs} | Type: ${m.type} | Status: <span style="color:${m.status==='completed'?'green':'blue'};">${m.status}</span></span>
                            </div>
                            <div>
                                <a href="${controllerLink}" class="btn-launch">🚀 Launch Controller</a>
                            </div>
                        `;
                        mContainer.appendChild(li);
                    });
                } else {
                    mContainer.innerHTML = "<li style='text-align:center; color:#888;'>No matches scheduled yet. Schedule above!</li>";
                }
            }
        } catch (err) {
            console.error("Error loading tournament data:", err);
        }
    }

    initTournamentPage();
</script>

</body>
</html>

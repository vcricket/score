<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament & Match Management Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 850px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header-nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        
        .btn-link { background: #0056b3; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; }
        .btn-link:hover { background: #004085; }

        h2, h3 { color: #1e3c72; font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        
        .box { background: #f9f9f9; padding: 18px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 10px; font-size: 14px; color: #444; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .btn:hover { background: #218838; }

        .match-list, .team-list { list-style: none; padding: 0; margin-top: 10px; }
        .match-item, .team-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <h2 id="tourTitle">🏆 Tournament Hub</h2>
        <div>
            <a id="profileLinkBtn" href="profile.html" class="btn-link">👤 My Profile</a>
            <a id="dashboardLinkBtn" href="index.html" class="btn-link" style="background: #4a5568;">🏠 Dashboard</a>
        </div>
    </div>

    <!-- যদি টুর্নামেন্ট আইডি (t) না থাকে, তবে ইউজার তার টুর্নামেন্ট সিলেক্ট বা ক্রিয়েট করার অপشن দেখবে -->
    <div id="noTournamentView" class="hidden">
        <div class="box">
            <h3>⚠️ No Tournament Selected</h3>
            <p style="font-size: 14px; color: #555;">Please go back to your Profile hub and select a specific tournament, or create a new one.</p>
            <a id="backToProfileBtn" href="profile.html" class="btn" style="text-align: center; text-decoration: none; display: block;">Go to Profile & Tournaments</a>
        </div>
    </div>

    <!-- মূল টুর্নামেন্ট ও ম্যাচ ম্যানেজমেন্ট প্যানেল -->
    <div id="activeTournamentView">
        
        <!-- টিম ম্যানেজমেন্ট সেকশন -->
        <div class="box">
            <h3>👥 Add Teams to Tournament</h3>
            <label>Team Name</label>
            <input type="text" id="teamNameInput" placeholder="e.g. Royal Challengers">
            <button class="btn" onclick="window.addTeamToTournament()">Add Team</button>
            
            <h4 style="margin-top: 15px; color: #333;">Registered Teams:</h4>
            <ul id="teamsListContainer" class="team-list">
                <li style="color: #888; font-size: 14px;">No teams added yet.</li>
            </ul>
        </div>

        <!-- ম্যাচ শিডিউল ও লঞ্চ সেকশন -->
        <div class="box">
            <h3>⚔️ Create & Launch Match</h3>
            <label>Select Team 1</label>
            <select id="team1Select"><option value="">-- Select Team 1 --</option></select>

            <label>Select Team 2</label>
            <select id="team2Select"><option value="">-- Select Team 2 --</option></select>

            <button class="btn" style="background: #007bff;" onclick="window.launchMatch()">🚀 Launch Match Controller</button>
        </div>

    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getDatabase, ref, get, set, push, remove } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4yHWFEhUPjff5zS71DUNFK21vtqapKSU",
        authDomain: "cricket-score-d187a.firebaseapp.com",
        databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
        projectId: "cricket-score-d187a",
        storageBucket: "cricket-score-d187a.firebasestorage.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    let tourId = urlParams.get('t');
    let currentUsername = urlParams.get('u') || localStorage.getItem('proCricketUsername');

    if (!currentUsername) {
        alert("⚠️ Please login from dashboard first.");
        window.location.href = "index.html";
    }

    // হেডার নেভিগেশন লিংক সেটআপ
    document.getElementById('profileLinkBtn').href = `profile.html?u=${currentUsername}`;
    document.getElementById('dashboardLinkBtn').href = `index.html?u=${currentUsername}`;
    document.getElementById('backToProfileBtn.href') = `profile.html?u=${currentUsername}`;

    let currentUserId = "";

    async function initTournament() {
        try {
            const userRef = ref(db, 'usernames/' + currentUsername);
            const snap = await get(userRef);
            if (snap.exists()) {
                currentUserId = snap.val();
            } else {
                currentUserId = currentUsername;
            }

            // যদি নির্দিষ্ট টুর্নামেন্ট আইডি (t) না থাকে
            if (!tourId) {
                document.getElementById('activeTournamentView').classList.add('hidden');
                document.getElementById('noTournamentView').classList.remove('hidden');
                return;
            }

            // টুর্নামেন্টের নাম লোড করা
            const tourRef = ref(db, `users/${currentUserId}/tournaments/${tourId}`);
            const tourSnap = await get(tourRef);
            if (tourSnap.exists()) {
                document.getElementById('tourTitle').innerText = "🏆 " + (tourSnap.val().name || "Tournament Hub");
            }

            loadTeams();
        } catch (err) {
            console.error("Error initializing tournament:", err);
        }
    }

    window.addTeamToTournament = async function() {
        const teamName = document.getElementById('teamNameInput').value.trim();
        if (!teamName) {
            alert("⚠️ Please enter a team name!");
            return;
        }

        try {
            const newTeamRef = push(ref(db, `users/${currentUserId}/tournaments/${tourId}/teams`));
            await set(newTeamRef, { name: teamName });
            document.getElementById('teamNameInput').value = "";
            loadTeams();
            alert("✅ Team added successfully!");
        } catch (err) {
            console.error("Error adding team:", err);
            alert("❌ Failed to add team.");
        }
    };

    async function loadTeams() {
        const teamsContainer = document.getElementById('teamsListContainer');
        const team1Select = document.getElementById('team1Select');
        const team2Select = document.getElementById('team2Select');

        teamsContainer.innerHTML = "";
        team1Select.innerHTML = '<option value="">-- Select Team 1 --</option>';
        team2Select.innerHTML = '<option value="">-- Select Team 2 --</option>';

        try {
            const teamsSnap = await get(ref(db, `users/${currentUserId}/tournaments/${tourId}/teams`));
            if (teamsSnap.exists()) {
                const teams = teamsSnap.val();
                
                Object.keys(teams).forEach(teamId => {
                    const team = teams[teamId];
                    
                    // টিম লিস্টে শো করা
                    let li = document.createElement('li');
                    li.className = "team-item";
                    li.innerHTML = `<span>🏏 ${team.name}</span>`;
                    teamsContainer.appendChild(li);

                    // ড্রপডাউনে যুক্ত করা
                    let opt1 = document.createElement('option');
                    opt1.value = team.name;
                    opt1.innerText = team.name;
                    team1Select.appendChild(opt1);

                    let opt2 = document.createElement('option');
                    opt2.value = team.name;
                    opt2.innerText = team.name;
                    team2Select.appendChild(opt2);
                });
            } else {
                teamsContainer.innerHTML = '<li style="color: #888; font-size: 14px;">No teams added yet.</li>';
            }
        } catch (e) {
            console.error("Error loading teams:", e);
        }
    }

    window.launchMatch = function() {
        const team1 = document.getElementById('team1Select').value;
        const team2 = document.getElementById('team2Select').value;

        if (!team1 || !team2) {
            alert("⚠️ Please select both teams!");
            return;
        }
        if (team1 === team2) {
            alert("⚠️ Team 1 and Team 2 cannot be the same!");
            return;
        }

        // কন্ট্রোলার পেজে রিডাইরেক্ট করা
        window.location.href = `controller.html?t=${tourId}&u=${currentUsername}&t1=${encodeURIComponent(team1)}&t2=${encodeURIComponent(team2)}`;
    };

    initTournament();
</script>

</body>
</html>

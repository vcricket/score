<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Points Table</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 850px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f1f1f1; padding-bottom: 15px; }
        h2 { color: #0056b3; margin: 0; font-size: 22px; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; }
        th, td { padding: 14px 12px; text-align: center; border-bottom: 1px solid #e9ecef; font-size: 15px; }
        th { background: #007bff; color: white; font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; }
        tr:hover { background: #f8f9fa; }
        .team-name { text-align: left; font-weight: bold; color: #333; }
        .pts-bold { font-weight: bold; color: #28a745; font-size: 16px; }
        .loading-text { text-align: center; color: #666; padding: 20px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <h2>📊 Tournament Points Table</h2>
    </div>
    
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th style="text-align: left;">Team Name</th>
                    <th>P</th>
                    <th>W</th>
                    <th>L</th>
                    <th>Pts</th>
                    <th>NRR</th>
                </tr>
            </thead>
            <tbody id="pointsTableBody">
                <tr><td colspan="6" class="loading-text">Loading points table...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Firebase Scripts -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABphVo2kWvqHEkxWSsZuDvnyXk05XzX-0",
      authDomain: "cricket-score-d187a.firebaseapp.com",
      databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
      projectId: "cricket-score-d187a",
      storageBucket: "cricket-score-d187a.firebasestorage.app",
      messagingSenderId: "782741896785",
      appId: "1:782741896785:android:ca8c45a9120f7784928270"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    // ইউআরএল এ ইউজারনেম না থাকলে অটোমেটিক লোকাল স্টোরেজ থেকে নেবে
    let targetUsername = urlParams.get('u') || localStorage.getItem('proCricketUsername');
    let tourId = urlParams.get('t');

    async function loadPointsTable() {
        const tableBody = document.getElementById('pointsTableBody');
        
        if (!targetUsername) {
            tableBody.innerHTML = `<tr><td colspan="6" style="color:red; padding: 20px;">⚠️ Please login first! Username missing.</td></tr>`;
            return;
        }

        try {
            // ১. Username থেকে আসল UID বের করা
            let currentUserId = targetUsername;
            const userRef = ref(db, 'usernames/' + targetUsername);
            const userSnap = await get(userRef);
            if (userSnap.exists()) {
                currentUserId = userSnap.val();
            }

            // ২. টুর্নামেন্ট আইডি অটো-ডিটেক্ট করা (যদি লিংকে না থাকে)
            if (!tourId || tourId === 'null') {
                const liveSnap = await get(ref(db, `live_matches/${targetUsername}/score/tournamentId`));
                if (liveSnap.exists() && liveSnap.val() !== "null") {
                    tourId = liveSnap.val();
                } else {
                    // লাইভ ম্যাচ না থাকলে সর্বশেষ টুর্নামেন্টটি খুঁজে বের করবে
                    const allToursSnap = await get(ref(db, `users/${currentUserId}/tournaments`));
                    if (allToursSnap.exists()) {
                        const tours = allToursSnap.val();
                        const tourKeys = Object.keys(tours);
                        tourId = tourKeys[tourKeys.length - 1]; 
                    }
                }
            }

            if (!tourId || tourId === 'null') {
                tableBody.innerHTML = `<tr><td colspan="6" style="color:#dc3545; padding: 20px;">⚠️ No active tournament found. Please create one!</td></tr>`;
                return;
            }

            // ৩. প্রথমে দেখবে লাইভ টুর্নামেন্ট ডেটাতে কোনো পয়েন্ট টেবিল আছে কি না
            let teamsData = null;
            const livePointsSnap = await get(ref(db, `live_matches/${targetUsername}/tournaments_data/${tourId}/teams`));
            
            if (livePointsSnap.exists()) {
                teamsData = livePointsSnap.val();
            }

            // ৪. ম্যাচ খেলা না হলে (ডেটা না থাকলে), মেইন ডাটাবেস থেকে টিমগুলো জিরো (0) অবস্থায় নিয়ে আসবে (Fallback)
            if (!teamsData) {
                const mainTeamsSnap = await get(ref(db, `users/${currentUserId}/tournaments/${tourId}/teams`));
                if (mainTeamsSnap.exists()) {
                    teamsData = mainTeamsSnap.val();
                }
            }

            if (!teamsData) {
                tableBody.innerHTML = `<tr><td colspan="6" style="color:#888; padding: 20px;">No teams added yet. Please add teams in Tournament Hub!</td></tr>`;
                return;
            }

            tableBody.innerHTML = "";
            let teamsArray = Object.keys(teamsData).map(key => teamsData[key]);

            // পয়েন্ট এবং নেট রানরেটের ভিত্তিতে দলগুলোকে সাজানো (Sorting)
            teamsArray.sort((a, b) => (b.points || 0) - (a.points || 0) || parseFloat(b.netRunRate || 0) - parseFloat(a.netRunRate || 0));

            teamsArray.forEach((team, index) => {
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td class="team-name">${index + 1}. ${team.name || 'Team'}</td>
                    <td>${team.matchesPlayed || 0}</td>
                    <td>${team.won || 0}</td>
                    <td>${team.lost || 0}</td>
                    <td class="pts-bold">${team.points || 0}</td>
                    <td>${team.netRunRate || '+0.000'}</td>
                `;
                tableBody.appendChild(row);
            });
        } catch (error) {
            console.error("Error loading points:", error);
            tableBody.innerHTML = `<tr><td colspan="6" style="color:red; padding: 20px;">Failed to load points table. Check console.</td></tr>`;
        }
    }

    // পেজ লোড হলেই পয়েন্ট টেবিল কল হবে
    window.onload = loadPointsTable;

</script>
</body>
</html>
